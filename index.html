<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06143F">
<link rel="manifest" href="./manifest.webmanifest?v=15">
<link rel="apple-touch-icon" href="./segamap-logo.svg?v=15">
<title>SegaMap 🇲🇺</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#101828}#map{position:fixed;inset:0}.panel{position:fixed;z-index:1000;left:14px;top:14px;width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;background:#fffffff5;backdrop-filter:blur(18px);border-radius:26px;padding:16px;box-shadow:0 20px 70px #0004}.brand{display:flex;align-items:center;gap:9px;font-size:28px;font-weight:950}.logo{width:48px;height:48px;object-fit:contain}.name{color:#06143F}.sub,.small{font-size:12px;color:#667085}.sub{margin:2px 0 14px}.search{border:1px solid #e4e7ec;border-radius:18px;background:#fff}.field{position:relative;display:flex;gap:10px;padding:14px}.field+.field{border-top:1px solid #eef0f3}.dot{width:10px;height:10px;border-radius:50%;background:#ef233c;margin-top:5px;flex:none}.dot.blue{background:#0072ce}input{border:0;outline:0;width:100%;font-size:16px;background:transparent}.suggestions{position:absolute;z-index:3000;left:34px;right:10px;top:50px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 15px 45px #0003;overflow:hidden}.suggestion{display:block;width:100%;border:0;background:#fff;text-align:left;padding:12px 14px;border-bottom:1px solid #f2f4f7}.suggestion b{font-size:13px}.suggestion span{display:block;font-size:11px;color:#667085;margin-top:3px}.actions{display:flex;gap:7px;margin-top:8px}.btn{flex:1;border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:10px 8px;font-weight:850}.go{width:100%;border:0;background:linear-gradient(90deg,#ef233c,#0072ce);color:#fff;border-radius:14px;padding:14px;margin-top:8px;font-weight:950;font-size:15px}.go:disabled{opacity:.6}.title{font-size:12px;font-weight:950;margin:14px 0 7px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px}.step{padding:10px 0;border-bottom:1px solid #eee}.step:last-child{border:0}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:950;background:#e8f5ee;color:#067647}.warn{background:#fff8df;color:#8a6500;border-radius:11px;padding:10px;font-size:11px;line-height:1.4;margin-top:8px}.ok{color:#067647;font-weight:900}.err{color:#b42318;font-weight:900}.follow{margin-top:10px;width:100%;border:0;background:#06143F;color:#fff;border-radius:12px;padding:11px;font-weight:900}.hidden{display:none!important}@media(max-width:760px){.panel{width:calc(100vw - 20px);left:10px;top:10px;max-height:calc(100vh - 20px)}}
</style>
</head>
<body>
<div id="map"></div>
<section class="panel">
  <div class="brand"><img class="logo" src="./segamap-logo.svg?v=15" alt="SegaMap"><span class="name">SegaMap</span><span>🇲🇺</span></div>
  <div class="sub">Le transport mauricien, pensé pour toute l’île.</div>
  <div class="search">
    <div class="field"><span class="dot"></span><input id="from" value="Ma position" placeholder="Départ" autocomplete="off"><div id="fromSug" class="suggestions hidden"></div></div>
    <div class="field"><span class="dot blue"></span><input id="to" placeholder="Où allez-vous ?" autocomplete="off"><div id="toSug" class="suggestions hidden"></div></div>
  </div>
  <div class="actions"><button class="btn" id="gps">⌖ Ma position</button><button class="btn" id="pick">📍 Carte</button><button class="btn" id="swap">⇅ Inverser</button></div>
  <button class="go" id="go">Trouver le meilleur trajet</button>
  <div class="title">Itinéraire</div>
  <div id="result" class="card"><b>Prêt 😊</b><div class="small">Choisis une destination pour rechercher les correspondances.</div></div>
  <div class="title">Réseau mauricien</div>
  <div class="card"><span id="network" class="badge">Connexion…</span><div id="status" class="small" style="margin-top:7px">Vérification du moteur de trajet…</div></div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const WORKER='https://maurimove.meriammb.workers.dev';
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=L.map('map').setView([-20.30,57.50],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let userPos=null,layers=[],pickMode=false,watchId=null,currentTrip=null;
const LOCAL=[
 ['c care','C-Care Tamarin',-20.35775,57.36850],['c-care tamarin','C-Care Tamarin',-20.35775,57.36850],['nautica','Nautica Commercial Centre',-20.35775,57.36850],
 ['cascavelle','Cascavelle Shopping Mall',-20.27819,57.40225],['carrefour flic en flac','Carrefour City Flic-en-Flac',-20.2749,57.3742],['port louis','Port Louis Victoria',-20.16194,57.49889],
 ['quatre bornes','Quatre Bornes Traffic Centre',-20.264,57.479],['rose hill','Rose Hill Bus Station',-20.233,57.469],['curepipe','Curepipe Bus Station',-20.318,57.526],['central flacq','Central Flacq Bus Station',-20.190,57.714],['mahebourg','Mahébourg Bus Station',-20.408,57.700],
 ['sofitel','Sofitel Mauritius L Imperial Resort And Spa',-20.311623,57.367472],['wolmar','Wolmar',-20.3125,57.362]
];
function localSearch(q){const n=norm(q);if(!n)return[];return LOCAL.filter(x=>norm(x[0]).includes(n)||n.includes(norm(x[0]))||norm(x[1]).includes(n)).filter((x,i,a)=>a.findIndex(y=>y[1]===x[1])===i).map(x=>({label:x[1],address:x[1]+', Mauritius',lat:x[2],lon:x[3]})).slice(0,7)}
async function getJSON(url,opt={},ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function searchPlace(q){const local=localSearch(q);if(local.length)return local;try{const d=await getJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&countrycodes=mu&q='+encodeURIComponent(q+', Mauritius'),{headers:{'Accept-Language':'fr'}},7000);return d.map(x=>({label:x.name||x.display_name.split(',')[0],address:x.display_name,lat:+x.lat,lon:+x.lon}))}catch{return[]}}
function bind(input,box){let timer;input.addEventListener('input',()=>{delete input.dataset.lat;delete input.dataset.lon;delete input.dataset.label;clearTimeout(timer);const q=input.value.trim();if(q.length<2){box.classList.add('hidden');return}timer=setTimeout(async()=>{const data=await searchPlace(q);box.innerHTML='';if(!data.length)box.innerHTML='<div class="suggestion"><span>Aucun lieu trouvé à Maurice.</span></div>';for(const x of data){const b=document.createElement('button');b.className='suggestion';b.innerHTML='<b>📍 '+esc(x.label)+'</b><span>'+esc(x.address)+'</span>';b.onclick=()=>{input.value=x.label;input.dataset.lat=x.lat;input.dataset.lon=x.lon;input.dataset.label=x.label;box.classList.add('hidden')};box.appendChild(b)}box.classList.remove('hidden')},180)})}
bind($('from'),$('fromSug'));bind($('to'),$('toSug'));
function locate(){return new Promise(resolve=>navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude,label:'Ma position'};map.setView([p.coords.latitude,p.coords.longitude],15);resolve(userPos)},()=>resolve(null),{enableHighAccuracy:true,timeout:12000,maximumAge:10000}))}
$('gps').onclick=async()=>{const p=await locate();if(p){$('from').value='Ma position';delete $('from').dataset.lat;delete $('from').dataset.lon;delete $('from').dataset.label;L.circleMarker([p.lat,p.lon],{radius:8}).addTo(map).bindPopup('Ma position').openPopup()}};
$('pick').onclick=()=>{pickMode=!pickMode;$('pick').textContent=pickMode?'📍 Cliquez sur la carte':'📍 Carte';map.getContainer().style.cursor=pickMode?'crosshair':''};
map.on('click',e=>{if(!pickMode)return;const i=$('to');i.value='Point sur la carte';i.dataset.lat=e.latlng.lat;i.dataset.lon=e.latlng.lng;i.dataset.label='Point sur la carte';pickMode=false;$('pick').textContent='📍 Carte';map.getContainer().style.cursor='';clearMap();layers.push(L.marker(e.latlng).addTo(map).bindPopup('Destination').openPopup())});
$('swap').onclick=()=>{const a=$('from').value,b=$('to').value,ad={...$('from').dataset},bd={...$('to').dataset};$('from').value=b;$('to').value=a;$('from').dataset.lat=bd.lat||'';$('from').dataset.lon=bd.lon||'';$('from').dataset.label=bd.label||'';$('to').dataset.lat=ad.lat||'';$('to').dataset.lon=ad.lon||'';$('to').dataset.label=ad.label||''};
async function resolveInput(i){if(norm(i.value)==='ma position')return userPos||await locate();if(i.dataset.lat)return{lat:+i.dataset.lat,lon:+i.dataset.lon,label:i.dataset.label||i.value};const a=await searchPlace(i.value);return a[0]||null}
function clearMap(){layers.forEach(x=>{try{map.removeLayer(x)}catch{}});layers=[]}
function legTitle(leg){if(leg.kind==='bus')return '🚌 Ligne '+esc(leg.route_id);if(leg.kind==='transfer')return '🔄 Correspondance';return '🚶 Marche'}
function renderResult(data){const legs=data.legs||[];let h='<div style="font-size:18px;font-weight:950">'+esc(data.from?.label||'Départ')+' → '+esc(data.to?.label||'Destination')+'</div><div class="small">≈ '+esc(data.minutes)+' min indicatives · réseau ouest</div>';for(const leg of legs){if(leg.kind==='walk'){h+='<div class="step"><b>🚶 Marche</b><div class="small">'+esc(leg.minutes)+' min · '+esc(leg.meters)+' m</div></div>'}else if(leg.kind==='transfer'){h+='<div class="step"><b>🔄 Correspondance</b><div class="small">'+esc(leg.from_name||'')+'</div></div>'}else{const s=leg.stops||[];h+='<div class="step"><b>'+legTitle(leg)+'</b><div class="small">'+esc(s[0]?.name||'')+' → '+esc(s.at(-1)?.name||'')+'</div><div class="small">'+s.length+' arrêts · temps publié</div></div>'}}h+='<div class="warn">Les horaires sont issus des données publiées. SegaMap ne fournit pas de position GPS ou ETA en temps réel.</div>';return h}
async function drawGeometry(data){clearMap();if(data.from?.lat&&data.to?.lat){layers.push(L.marker([data.from.lat,data.from.lon]).addTo(map).bindPopup(data.from.label||'Départ'));layers.push(L.marker([data.to.lat,data.to.lon]).addTo(map).bindPopup(data.to.label||'Destination'))}const c=data.geometry?.coordinates||[];if(c.length){const line=c.map(p=>[p[1],p[0]]);layers.push(L.polyline(line,{weight:6,opacity:.9}).addTo(map));map.fitBounds(L.latLngBounds(line),{padding:[30,30]})}}
async function route(A,B){return getJSON(WORKER+'/api/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:{lat:A.lat,lon:A.lon,name:A.label},to:{lat:B.lat,lon:B.lon,name:B.label})}},25000)}
$('go').onclick=async()=>{const btn=$('go');btn.disabled=true;btn.textContent='Recherche…';$('result').innerHTML='<b>🔎 Recherche du meilleur trajet…</b><div class="small">Connexion au moteur SegaMap.</div>';try{const A=await resolveInput($('from')),B=await resolveInput($('to'));if(!A||!B)throw Error('Lieu introuvable');const data=await route(A,B);if(!data.ok)throw Error(data.error||'Aucun trajet trouvé');currentTrip=data;$('result').innerHTML=renderResult(data);await drawGeometry(data)}catch(e){$('result').innerHTML='<b class="err">Impossible de calculer ce trajet.</b><div class="small">'+esc(e.message||'Erreur inconnue')+'</div>'}finally{btn.disabled=false;btn.textContent='Trouver le meilleur trajet'}};
async function checkWorker(){try{const d=await getJSON(WORKER+'/health',{},8000);$('network').textContent='Moteur SegaMap connecté';$('status').innerHTML='<span class="ok">✓ Worker opérationnel · lignes '+esc((d.routes||[]).join(', '))+'</span>'}catch(e){$('network').textContent='Moteur indisponible';$('status').innerHTML='<span class="warn">Le moteur de trajet n’est pas joignable pour le moment.</span>'}}
checkWorker();
</script>
</body>
</html>
