<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06143F"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./segamap-logo.svg"><title>SegaMap 🇲🇺</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#101828}#map{position:fixed;inset:0}.panel{position:fixed;z-index:1000;left:14px;top:14px;width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;background:#fffffff5;backdrop-filter:blur(18px);border-radius:26px;padding:16px;box-shadow:0 20px 70px #0004}.brand{display:flex;align-items:center;gap:9px;font-size:28px;font-weight:950}.logo{width:46px;height:46px;object-fit:contain}.name{color:#06143F}.sub,.small{font-size:12px;color:#667085}.sub{margin:2px 0 14px}.search{border:1px solid #e4e7ec;border-radius:18px;background:#fff}.field{position:relative;display:flex;gap:10px;padding:14px}.field+.field{border-top:1px solid #eef0f3}.dot{width:10px;height:10px;border-radius:50%;background:#ef233c;margin-top:5px;flex:none}.dot.blue{background:#0072ce}input{border:0;outline:0;width:100%;font-size:16px;background:transparent}.suggestions{position:absolute;z-index:3000;left:34px;right:10px;top:50px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 15px 45px #0003;overflow:hidden}.suggestion{display:block;width:100%;border:0;background:#fff;text-align:left;padding:12px 14px;border-bottom:1px solid #f2f4f7}.suggestion b{font-size:13px}.suggestion span{display:block;font-size:11px;color:#667085;margin-top:3px}.actions{display:flex;gap:7px;margin-top:8px}.btn{flex:1;border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:10px 8px;font-weight:850}.go{width:100%;border:0;background:linear-gradient(90deg,#ef233c,#0072ce);color:#fff;border-radius:14px;padding:14px;margin-top:8px;font-weight:950;font-size:15px}.go:disabled{opacity:.6}.title{font-size:12px;font-weight:950;margin:14px 0 7px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px}.step{padding:10px 0;border-bottom:1px solid #eee}.step:last-child{border:0}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:950;background:#e8f5ee;color:#067647}.warn{background:#fff8df;color:#8a6500;border-radius:11px;padding:10px;font-size:11px;line-height:1.4;margin-top:8px}.ok{color:#067647;font-weight:900}.err{color:#b42318;font-weight:900}.follow{margin-top:10px;width:100%;border:0;background:#06143F;color:#fff;border-radius:12px;padding:11px;font-weight:900}.hidden{display:none!important}</style></head><body><div id="map"></div><section class="panel"><div class="brand"><img class="logo" src="./segamap-logo.svg" alt="SegaMap"><span class="name">SegaMap</span><span>🇲🇺</span></div><div class="sub">Le transport mauricien, pensé pour toute l’île.</div><div class="search"><div class="field"><span class="dot"></span><input id="from" value="Ma position" placeholder="Départ" autocomplete="off"><div id="fromSug" class="suggestions hidden"></div></div><div class="field"><span class="dot blue"></span><input id="to" placeholder="Où allez-vous ?" autocomplete="off"><div id="toSug" class="suggestions hidden"></div></div></div><div class="actions"><button class="btn" id="gps">⌖ Ma position</button><button class="btn" id="pick">📍 Carte</button><button class="btn" id="swap">⇅ Inverser</button></div><button class="go" id="go">Trouver le meilleur trajet</button><div class="title">Itinéraire</div><div id="result" class="card"><b>Prêt 😊</b><div class="small">Choisis une destination pour rechercher les correspondances.</div></div><div class="title">Réseau mauricien</div><div class="card"><span id="network" class="badge">Chargement…</span><div id="status" class="small" style="margin-top:7px">Chargement…</div></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const $=id=>document.getElementById(id), norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=L.map('map').setView([-20.3484,57.5522],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routes=[],nltaCount=0,userPos=null,currentTrip=null,watchId=null,layers=[];
const LOCAL=[['c care','C-Care Tamarin',-20.3258,57.3819],['cascavelle','Cascavelle Shopping Mall',-20.2856,57.4001],['carrefour flic en flac','Carrefour City Flic-en-Flac',-20.2749,57.3742],['port louis','Port Louis Bus Station',-20.164,57.501],['quatre bornes','Quatre Bornes Traffic Centre',-20.264,57.479],['rose hill','Rose Hill Bus Station',-20.233,57.469],['curepipe','Curepipe Bus Station',-20.318,57.526],['central flacq','Central Flacq Bus Station',-20.190,57.714],['mahebourg','Mahébourg Bus Station',-20.408,57.700]];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function getJSON(url,opt={},ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
function dist(a,b){const la=((a.lat+b.lat)/2)*Math.PI/180,dx=(a.lon-b.lon)*111.32*Math.cos(la),dy=(a.lat-b.lat)*110.57;return Math.hypot(dx,dy)}
function localSearch(q){const n=norm(q);return LOCAL.filter(x=>norm(x[0]).includes(n)||n.includes(norm(x[0]))).map(x=>({label:x[1],address:x[1]+', Mauritius',lat:x[2],lon:x[3]})).slice(0,6)}
async function searchPlace(q){const l=localSearch(q);if(l.length)return l;try{const d=await getJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&countrycodes=mu&q='+encodeURIComponent(q+', Mauritius'),{headers:{'Accept-Language':'fr'}},7000);return d.map(x=>({label:x.name||x.display_name.split(',')[0],address:x.display_name,lat:+x.lat,lon:+x.lon}))}catch{return[]}}
function bind(input,box){let timer;input.addEventListener('input',()=>{delete input.dataset.lat;delete input.dataset.lon;delete input.dataset.label;clearTimeout(timer);const q=input.value.trim();if(q.length<2){box.classList.add('hidden');return}timer=setTimeout(async()=>{const data=await searchPlace(q);box.innerHTML='';if(!data.length)box.innerHTML='<div class="suggestion"><span>Aucun lieu trouvé à Maurice.</span></div>';for(const x of data){const b=document.createElement('button');b.className='suggestion';b.innerHTML='<b>📍 '+esc(x.label)+'</b><span>'+esc(x.address)+'</span>';b.onclick=()=>{input.value=x.label;input.dataset.lat=x.lat;input.dataset.lon=x.lon;input.dataset.label=x.label;box.classList.add('hidden')};box.appendChild(b)}box.classList.remove('hidden')},220)})}
bind($('from'),$('fromSug'));bind($('to'),$('toSug'));
async function locate(){return new Promise(resolve=>navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude,label:'Ma position'};resolve(userPos)},()=>{alert('Autorise la localisation de SegaMap dans Safari.');resolve(null)},{enableHighAccuracy:true,timeout:10000,maximumAge:15000}))}
async function resolveInput(i){if(norm(i.value)==='ma position')return userPos||await locate();if(i.dataset.lat)return{lat:+i.dataset.lat,lon:+i.dataset.lon,label:i.dataset.label||i.value};const a=await searchPlace(i.value);return a[0]||null}
function clearMap(){layers.forEach(x=>{try{map.removeLayer(x)}catch{}});layers=[]}
async function loadNLTA(){try{const d=await getJSON('./data/nlta-routes.json?v=20260815',{},8000);nltaCount=+d.route_count||0;$('network').textContent=nltaCount+' lignes NLTA au catalogue'}catch{$('network').textContent='Catalogue NLTA indisponible'}}
async function overpass(){const q='[out:json][timeout:30];rel["type"="route"]["route"="bus"](-20.60,57.20,-19.90,57.90);out body;>;out skel qt;';for(const ep of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const z=await getJSON(ep,{method:'POST',body:new URLSearchParams({data:q})},20000),nodes=new Map(),out=[];for(const e of z.elements||[]){if(e.type==='node'&&e.lat!==undefined)nodes.set(e.id,{id:e.id,lat:+e.lat,lon:+e.lon,name:e.tags?.name||'Arrêt de bus'})}for(const r of z.elements||[]){if(r.type!=='relation'||r.tags?.route!=='bus')continue;const ss=[],seen=new Set();for(const m of r.members||[]){if(m.type==='node'&&nodes.has(m.ref)&&['stop','platform','stop_entry_only','platform_entry_only','stop_exit_only','platform_exit_only'].includes(m.role)&&!seen.has(m.ref)){seen.add(m.ref);ss.push(nodes.get(m.ref))}}if(ss.length>=2)out.push({ref:String(r.tags.ref||r.tags.name||r.id).trim(),from:r.tags.from||'',to:r.tags.to||'',operator:r.tags.operator||'',stops:ss})}if(out.length){routes=out;$('status').innerHTML='<span class="ok">✓ '+routes.length+' parcours cartographiques · '+nltaCount+' lignes NLTA au catalogue</span>';return true}}catch(e){}}return false}
function graph(){const nodes=[],edges=new Map();routes.forEach((r,ri)=>r.stops.forEach((s,si)=>{const id=ri+':'+si;nodes.push({id,ri,si,stop:s,route:r});edges.set(id,[])}));routes.forEach((r,ri)=>{for(let i=0;i<r.stops.length-1;i++){const d=dist(r.stops[i],r.stops[i+1]);if(d<3)edges.get(ri+':'+i).push({to:ri+':'+(i+1),type:'bus',min:Math.max(1,Math.round(d*3.3))})}});const cell=.006,b=new Map();for(const n of nodes){const k=Math.floor(n.stop.lat/cell)+':'+Math.floor(n.stop.lon/cell);if(!b.has(k))b.set(k,[]);b.get(k).push(n)}for(const a of nodes){const x=Math.floor(a.stop.lat/cell),y=Math.floor(a.stop.lon/cell);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(const c of b.get((x+dx)+':'+(y+dy))||[]){if(a.ri===c.ri)continue;const d=dist(a.stop,c.stop);if(d<=.32)edges.get(a.id).push({to:c.id,type:'transfer',min:Math.max(3,Math.round(d*12)+2)})}}return{nodes,edges}}
function nearest(p,g){return g.nodes.map(n=>({...n,d:dist(p,n.stop)})).filter(x=>x.d<=1.5).sort((a,b)=>a.d-b.d).slice(0,35)}
function solve(A,B){const g=graph(),starts=nearest(A,g),goals=nearest(B,g);if(!starts.length||!goals.length)return null;const goal=new Set(goals.map(x=>x.id)),D=new Map(),P=new Map(),q=[];for(const s of starts){D.set(s.id,s.d*12);q.push([s.id,D.get(s.id)])}let end=null;while(q.length){q.sort((a,b)=>a[1]-b[1]);const [id,c]=q.shift();if(c!==D.get(id))continue;if(goal.has(id)){end=id;break}for(const e of g.edges.get(id)||[]){const nc=c+e.min+(e.type==='transfer'?4:0);if(nc<(D.get(e.to)??Infinity)){D.set(e.to,nc);P.set(e.to,{id,e});q.push([e.to,nc])}}}if(!end)return null;const ids=[];for(let x=end;x;x=P.get(x)?.id)ids.push(x);ids.reverse();const by=new Map(g.nodes.map(n=>[n.id,n]));return{path:ids.map(x=>by.get(x)),minutes:Math.round(D.get(end)),start:by.get(ids[0]).stop,end:by.get(ids[ids.length-1]).stop}}
function segments(path){const out=[];let cur=null;for(const n of path){if(!cur||cur.ri!==n.ri){if(cur)out.push(cur);cur={ri:n.ri,route:n.route,stops:[n.stop]}}else cur.stops.push(n.stop)}if(cur)out.push(cur);return out}
async function draw(A,B,t){clearMap();const pts=[[A.lat,A.lon],[B.lat,B.lon]];layers.push(L.marker([A.lat,A.lon]).addTo(map),L.marker([B.lat,B.lon]).addTo(map));for(const s of segments(t.path)){if(s.stops.length<2)continue;let line=null;try{const u='https://router.project-osrm.org/route/v1/driving/'+s.stops.map(p=>p.lon+','+p.lat).join(';')+'?overview=full&geometries=geojson&steps=false';const j=await getJSON(u,{},15000);line=j.routes?.[0]?.geometry?.coordinates?.map(p=>[p[1],p[0]])}catch{}if(!line)line=s.stops.map(p=>[p.lat,p.lon]);const poly=L.polyline(line,{weight:6,opacity:.9}).addTo(map);layers.push(poly);pts.push(...line)}map.fitBounds(L.latLngBounds(pts),{padding:[30,30]})}
function render(A,B,t){const ss=segments(t.path);let h='<div style="font-size:18px;font-weight:950">'+esc(A.label)+' → '+esc(B.label)+'</div><div class="small">≈ '+Math.max(1,t.minutes)+' min indicatives · '+ss.length+' ligne'+(ss.length>1?'s':'')+'</div>';ss.forEach((s,i)=>{const a=s.stops[0],b=s.stops[s.stops.length-1];h+='<div class="step"><b>🚌 Ligne '+esc(s.route.ref)+'</b><div class="small">'+esc(s.route.from||a.name)+' → '+esc(s.route.to||b.name)+'</div><div class="small">'+esc(a.name)+' → '+esc(b.name)+' · '+s.stops.length+' arrêts</div></div>';if(i<ss.length-1)h+='<div class="step"><b>🔄 Correspondance</b><div class="small">Descendre à '+esc(b.name)+' puis rejoindre l’arrêt suivant.</div></div>'});h+='<div class="warn">ETA et position des bus : non temps réel tant qu’une source GPS publique n’est pas disponible. La progression de ton propre trajet peut être suivie par GPS.</div><button id="follow" class="follow">📍 Suivre ma progression</button>';return h}
function follow(){if(!currentTrip||!navigator.geolocation)return;if(watchId)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{const here={lat:p.coords.latitude,lon:p.coords.longitude};const a=currentTrip.path.map(n=>n.stop);let bi=0,bd=Infinity;a.forEach((s,i)=>{const d=dist(here,s);if(d<bd){bd=d;bi=i}});let box=document.getElementById('progress');if(!box){box=document.createElement('div');box.id='progress';box.className='small';$('result').appendChild(box)}box.innerHTML='<b>📍 Progression</b><br>Arrêt le plus proche : '+esc(a[bi].name)+' · '+Math.max(0,a.length-1-bi)+' arrêt(s) restant(s)'},()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000});$('follow').disabled=true;$('follow').textContent='✓ Suivi actif'}
$('gps').onclick=async()=>{const p=await locate();if(p){const i=$('from');i.value='Ma position';i.dataset.lat=p.lat;i.dataset.lon=p.lon;i.dataset.label='Ma position';map.setView([p.lat,p.lon],14)}};
$('swap').onclick=()=>{const f=$('from'),t=$('to'),v=f.value,d={...f.dataset};f.value=t.value;f.dataset.lat=t.dataset.lat||'';f.dataset.lon=t.dataset.lon||'';f.dataset.label=t.dataset.label||'';t.value=v;t.dataset.lat=d.lat||'';t.dataset.lon=d.lon||'';t.dataset.label=d.label||''};
$('pick').onclick=()=>map.once('click',e=>{const t=$('to');t.value='Point sélectionné';t.dataset.lat=e.latlng.lat;t.dataset.lon=e.latlng.lng;t.dataset.label='Point sélectionné';L.marker(e.latlng).addTo(map).bindPopup('Destination sélectionnée').openPopup()});
$('go').onclick=async()=>{const b=$('go');b.disabled=true;b.textContent='Recherche…';$('result').innerHTML='<b>Recherche en cours…</b><div class="small">Recherche des arrêts et correspondances.</div>';try{const A=await resolveInput($('from')),B=await resolveInput($('to'));if(!A||!B)throw Error('Départ ou destination introuvable.');if(!routes.length&&!await overpass())throw Error('Le réseau cartographique est momentanément indisponible.');const t=solve(A,B);if(!t){$('result').innerHTML='<b class="err">Aucun trajet bus confirmé.</b><div class="small">Aucun chemin exploitable n’a été trouvé dans les parcours actuellement cartographiés.</div>';return}currentTrip=t;await draw(A,B,t);$('result').innerHTML=render(A,B,t);$('follow').onclick=follow}catch(e){$('result').innerHTML='<b class="err">Impossible de calculer ce trajet.</b><div class="small">'+esc(e.message)+'</div>'}finally{b.disabled=false;b.textContent='Trouver le meilleur trajet'}};
(async()=>{await loadNLTA();if(!await overpass())$('status').innerHTML='<span class="err">Réseau cartographique indisponible.</span> · La recherche de lieux reste disponible.';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=13').catch(()=>{})})();
</script></body></html>
