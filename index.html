<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06143F"><link rel="manifest" href="./manifest.webmanifest?v=14"><link rel="apple-touch-icon" href="./segamap-logo.svg?v=14"><title>SegaMap 🇲🇺</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#101828}#map{position:fixed;inset:0}.panel{position:fixed;z-index:1000;left:14px;top:14px;width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;background:#fffffff5;backdrop-filter:blur(18px);border-radius:26px;padding:16px;box-shadow:0 20px 70px #0004}.brand{display:flex;align-items:center;gap:9px;font-size:28px;font-weight:950}.logo{width:48px;height:48px;object-fit:contain}.name{color:#06143F}.sub,.small{font-size:12px;color:#667085}.sub{margin:2px 0 14px}.search{border:1px solid #e4e7ec;border-radius:18px;background:#fff}.field{position:relative;display:flex;gap:10px;padding:14px}.field+.field{border-top:1px solid #eef0f3}.dot{width:10px;height:10px;border-radius:50%;background:#ef233c;margin-top:5px;flex:none}.dot.blue{background:#0072ce}input{border:0;outline:0;width:100%;font-size:16px;background:transparent}.suggestions{position:absolute;z-index:3000;left:34px;right:10px;top:50px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 15px 45px #0003;overflow:hidden}.suggestion{display:block;width:100%;border:0;background:#fff;text-align:left;padding:12px 14px;border-bottom:1px solid #f2f4f7}.suggestion b{font-size:13px}.suggestion span{display:block;font-size:11px;color:#667085;margin-top:3px}.actions{display:flex;gap:7px;margin-top:8px}.btn{flex:1;border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:10px 8px;font-weight:850}.go{width:100%;border:0;background:linear-gradient(90deg,#ef233c,#0072ce);color:#fff;border-radius:14px;padding:14px;margin-top:8px;font-weight:950;font-size:15px}.go:disabled{opacity:.6}.title{font-size:12px;font-weight:950;margin:14px 0 7px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px}.step{padding:10px 0;border-bottom:1px solid #eee}.step:last-child{border:0}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:950;background:#e8f5ee;color:#067647}.warn{background:#fff8df;color:#8a6500;border-radius:11px;padding:10px;font-size:11px;line-height:1.4;margin-top:8px}.ok{color:#067647;font-weight:900}.err{color:#b42318;font-weight:900}.follow{margin-top:10px;width:100%;border:0;background:#06143F;color:#fff;border-radius:12px;padding:11px;font-weight:900}.progress{margin-top:9px;background:#eef6ff;border-radius:12px;padding:10px;font-size:12px}.hidden{display:none!important}@media(max-width:760px){.panel{width:calc(100vw - 20px);left:10px;top:10px;max-height:calc(100vh - 20px)}}</style></head><body><div id="map"></div><section class="panel"><div class="brand"><img class="logo" src="./segamap-logo.svg?v=14" alt="SegaMap"><span class="name">SegaMap</span><span>🇲🇺</span></div><div class="sub">Le transport mauricien, pensé pour toute l’île.</div><div class="search"><div class="field"><span class="dot"></span><input id="from" value="Ma position" placeholder="Départ" autocomplete="off"><div id="fromSug" class="suggestions hidden"></div></div><div class="field"><span class="dot blue"></span><input id="to" placeholder="Où allez-vous ?" autocomplete="off"><div id="toSug" class="suggestions hidden"></div></div></div><div class="actions"><button class="btn" id="gps">⌖ Ma position</button><button class="btn" id="pick">📍 Carte</button><button class="btn" id="swap">⇅ Inverser</button></div><button class="go" id="go">Trouver le meilleur trajet</button><div class="title">Itinéraire</div><div id="result" class="card"><b>Prêt 😊</b><div class="small">Choisis une destination pour rechercher les correspondances.</div></div><div class="title">Réseau mauricien</div><div class="card"><span id="network" class="badge">Chargement…</span><div id="status" class="small" style="margin-top:7px">Chargement du réseau…</div></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=L.map('map').setView([-20.30,57.50],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routes=[],nltaCount=267,userPos=null,currentTrip=null,watchId=null,layers=[],pickMode=false;
const LOCAL=[
 ['c care','C-Care Tamarin',-20.35775,57.36850],['c-care tamarin','C-Care Tamarin',-20.35775,57.36850],['nautica','Nautica Commercial Centre',-20.35775,57.36850],
 ['cascavelle','Cascavelle Shopping Mall',-20.27819,57.40225],['carrefour flic en flac','Carrefour City Flic-en-Flac',-20.2749,57.3742],['port louis','Port Louis Victoria',-20.16194,57.49889],['quatre bornes','Quatre Bornes Traffic Centre',-20.264,57.479],['rose hill','Rose Hill Bus Station',-20.233,57.469],['curepipe','Curepipe Bus Station',-20.318,57.526],['central flacq','Central Flacq Bus Station',-20.190,57.714],['mahebourg','Mahébourg Bus Station',-20.408,57.700],['sofitel','Sofitel Mauritius L Imperial Resort And Spa',-20.311623,57.367472]
];
const seed=(ref,from,to,stops)=>({ref,from,to,operator:'NLTA/official timetable seed',stops:stops.map((s,i)=>({id:ref+'-'+i,name:s[0],lat:s[1],lon:s[2]}))});
const FALLBACK=[
 seed('123','Port Louis Immigration','Wolmar',[['Port Louis Immigration',-20.16194,57.49889],['GRNW',-20.1548,57.4865],['Camp Benoit',-20.1815,57.4595],['Petite Riviere Post Office',-20.1953,57.4267],['Gros Cailloux',-20.20722,57.4300],['Canot',-20.224,57.424],['Bambous Gamma',-20.252,57.415],['Bambous Dragon Store',-20.2571,57.4177],['Flic en Flac Junction',-20.281108,57.404107],['Domaine Anna',-20.286,57.394],['Flic en Flac School',-20.292,57.376],['Flic en Flac Beach',-20.298,57.366],['Wolmar',-20.3125,57.362]]),
 seed('57','Quatre Bornes Traffic Centre','Wolmar',[['Quatre Bornes Traffic Centre',-20.264,57.479],['La Louise',-20.271,57.471],['Palma Government School',-20.276,57.453],['Palma Junction',-20.278,57.447],['Beaux Songes Reservoir',-20.274,57.433],['Montee Bol',-20.268,57.425],['Bambous Mangues Vert Doux',-20.259,57.420],['Bambous Junction',-20.257,57.414],['Bambous Dragon Store',-20.2571,57.4177],['Flic en Flac Junction',-20.281108,57.404107],['Flic en Flac Anna Estate',-20.286,57.394],['Flic en Flac Government School',-20.292,57.376],['Flic en Flac Golden Beach',-20.298,57.366],['Wolmar',-20.3125,57.362]]),
 seed('5','Quatre Bornes Traffic Centre','Baie du Cap',[['Quatre Bornes Traffic Centre',-20.264,57.479],['La Louise',-20.271,57.471],['Palma Government School',-20.276,57.453],['Palma Junction',-20.278,57.447],['Beaux Songes Reservoir',-20.274,57.433],['Bambous',-20.257,57.4177],['Flic en Flac Junction',-20.281108,57.404107],['Clarence Beginning',-20.297,57.389],['Tamarin Beginning',-20.321,57.372],['Tamarin Salt Pans',-20.331,57.368],['La Preneuse',-20.345,57.366],['Ruisseau Creole / Nautica',-20.35775,57.36850],['Grande Riviere Noire',-20.361,57.363],['La Gaulette',-20.416,57.366],['Case Noyale',-20.423,57.362],['Le Morne Hotel Junction',-20.444,57.337],['Baie du Cap',-20.478,57.323]])
];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function getJSON(url,opt={},ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
function dist(a,b){const lat=((a.lat+b.lat)/2)*Math.PI/180,dx=(a.lon-b.lon)*111.32*Math.cos(lat),dy=(a.lat-b.lat)*110.57;return Math.hypot(dx,dy)}
function localSearch(q){const n=norm(q);if(!n)return[];return LOCAL.filter(x=>norm(x[0]).includes(n)||n.includes(norm(x[0]))||norm(x[1]).includes(n)).filter((x,i,a)=>a.findIndex(y=>y[1]===x[1])===i).map(x=>({label:x[1],address:x[1]+', Mauritius',lat:x[2],lon:x[3]})).slice(0,7)}
async function searchPlace(q){const local=localSearch(q);if(local.length)return local;try{const d=await getJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&countrycodes=mu&q='+encodeURIComponent(q+', Mauritius'),{headers:{'Accept-Language':'fr'}},7000);return d.map(x=>({label:x.name||x.display_name.split(',')[0],address:x.display_name,lat:+x.lat,lon:+x.lon}))}catch{return[]}}
function bind(input,box){let timer;input.addEventListener('input',()=>{delete input.dataset.lat;delete input.dataset.lon;delete input.dataset.label;clearTimeout(timer);const q=input.value.trim();if(q.length<2){box.classList.add('hidden');return}timer=setTimeout(async()=>{const data=await searchPlace(q);box.innerHTML='';if(!data.length)box.innerHTML='<div class="suggestion"><span>Aucun lieu trouvé à Maurice.</span></div>';for(const x of data){const b=document.createElement('button');b.className='suggestion';b.innerHTML='<b>📍 '+esc(x.label)+'</b><span>'+esc(x.address)+'</span>';b.onclick=()=>{input.value=x.label;input.dataset.lat=x.lat;input.dataset.lon=x.lon;input.dataset.label=x.label;box.classList.add('hidden')};box.appendChild(b)}box.classList.remove('hidden')},180)})}
bind($('from'),$('fromSug'));bind($('to'),$('toSug'));
async function locate(){return new Promise(resolve=>navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude,label:'Ma position'};map.setView([p.coords.latitude,p.coords.longitude],15);resolve(userPos)},()=>{resolve(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:10000}))}
$('gps').onclick=async()=>{const p=await locate();if(p){$('from').value='Ma position';delete $('from').dataset.lat;delete $('from').dataset.lon;L.circleMarker([p.lat,p.lon],{radius:8}).addTo(map).bindPopup('Ma position').openPopup()}};
$('pick').onclick=()=>{pickMode=!pickMode;$('pick').textContent=pickMode?'📍 Cliquez sur la carte':'📍 Carte';map.getContainer().style.cursor=pickMode?'crosshair':''};
map.on('click',e=>{if(!pickMode)return;const i=$('to');i.value='Point sur la carte';i.dataset.lat=e.latlng.lat;i.dataset.lon=e.latlng.lng;i.dataset.label='Point sur la carte';pickMode=false;$('pick').textContent='📍 Carte';L.marker(e.latlng).addTo(map).bindPopup('Destination').openPopup()});
$('swap').onclick=()=>{const a=$('from').value,b=$('to').value,ad={...$('from').dataset},bd={...$('to').dataset};$('from').value=b;$('to').value=a;Object.keys(ad).forEach(k=>$('to').dataset[k]=ad[k]);Object.keys(bd).forEach(k=>$('from').dataset[k]=bd[k])};
async function resolveInput(i){if(norm(i.value)==='ma position')return userPos||await locate();if(i.dataset.lat)return{lat:+i.dataset.lat,lon:+i.dataset.lon,label:i.dataset.label||i.value};const a=await searchPlace(i.value);return a[0]||null}
function clearMap(){layers.forEach(x=>{try{map.removeLayer(x)}catch{}});layers=[]}
async function loadNLTA(){try{const d=await getJSON('./data/nlta-routes.json?v=14',{},8000);nltaCount=+d.route_count||267}catch{}$('network').textContent=nltaCount+' lignes NLTA au catalogue'}
function addFallbacks(){const by=new Map(routes.map(r=>[r.ref+'|'+r.from+'|'+r.to,r]));for(const r of FALLBACK)if(!by.has(r.ref+'|'+r.from+'|'+r.to))routes.push(r)}
async function loadOSM(){const q='[out:json][timeout:25];rel["type"="route"]["route"="bus"](-20.60,57.20,-19.90,57.90);out body;>;out skel qt;';for(const ep of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const z=await getJSON(ep,{method:'POST',body:new URLSearchParams({data:q})},18000),nodes=new Map(),out=[];for(const e of z.elements||[])if(e.type==='node'&&e.lat!==undefined)nodes.set(e.id,{id:e.id,lat:+e.lat,lon:+e.lon,name:e.tags?.name||'Arrêt de bus'});for(const r of z.elements||[]){if(r.type!=='relation'||r.tags?.route!=='bus')continue;const ss=[],seen=new Set();for(const m of r.members||[])if(m.type==='node'&&nodes.has(m.ref)&&['stop','platform','stop_entry_only','platform_entry_only','stop_exit_only','platform_exit_only'].includes(m.role)&&!seen.has(m.ref)){seen.add(m.ref);ss.push(nodes.get(m.ref))}if(ss.length>=2)out.push({ref:String(r.tags.ref||r.tags.name||r.id).trim(),from:r.tags.from||'',to:r.tags.to||'',operator:r.tags.operator||'',stops:ss})}if(out.length){routes=out;addFallbacks();return}}catch{}}addFallbacks()}
function makeGraph(){const all=[];routes.forEach((r,ri)=>{all.push({r,ri,stops:r.stops});const rev={...r,stops:[...r.stops].reverse()};all.push({r:rev,ri:ri+'r',stops:rev.stops})});const nodes=[],edges=new Map();all.forEach((r,i)=>r.stops.forEach((s,si)=>{const id=i+':'+si;nodes.push({id,ri:i,si,stop:s,route:r.r});edges.set(id,[])}));all.forEach((r,i)=>{for(let j=0;j<r.stops.length-1;j++){const d=dist(r.stops[j],r.stops[j+1]);edges.get(i+':'+j).push({to:i+':'+(j+1),type:'bus',min:Math.max(1,Math.round(d*3.0))})}});const cell=.004,b=new Map();for(const n of nodes){const k=Math.floor(n.stop.lat/cell)+':'+Math.floor(n.stop.lon/cell);if(!b.has(k))b.set(k,[]);b.get(k).push(n)}for(const a of nodes){const x=Math.floor(a.stop.lat/cell),y=Math.floor(a.stop.lon/cell);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(const c of b.get((x+dx)+':'+(y+dy))||[]){if(a.id===c.id||a.route.ref===c.route.ref)continue;const d=dist(a.stop,c.stop);if(d<=.18)edges.get(a.id).push({to:c.id,type:'transfer',min:Math.max(2,Math.round(d*10)+2)})}}return{nodes,edges}}
function nearest(p,g){return g.nodes.map(n=>({...n,d:dist(p,n.stop)})).filter(x=>x.d<=2).sort((a,b)=>a.d-b.d).slice(0,45)}
function solve(A,B){const g=makeGraph(),starts=nearest(A,g),goals=nearest(B,g);if(!starts.length||!goals.length)return null;const goal=new Set(goals.map(x=>x.id)),D=new Map(),P=new Map(),q=[];for(const s of starts){D.set(s.id,s.d*12);q.push([s.id,D.get(s.id)])}let end=null;while(q.length){q.sort((a,b)=>a[1]-b[1]);const [id,c]=q.shift();if(c!==D.get(id))continue;if(goal.has(id)){end=id;break}for(const e of g.edges.get(id)||[]){const nc=c+e.min+(e.type==='transfer'?6:0);if(nc<(D.get(e.to)??Infinity)){D.set(e.to,nc);P.set(e.to,{id,e});q.push([e.to,nc])}}}if(!end)return null;const ids=[];for(let x=end;x;x=P.get(x)?.id)ids.push(x);ids.reverse();const by=new Map(g.nodes.map(n=>[n.id,n]));const path=ids.map(x=>by.get(x));return{path,minutes:Math.max(5,Math.round(D.get(end))),start:path[0].stop,end:path[path.length-1].stop}}
function segments(path){const out=[];let cur=null;for(const n of path){if(!cur||cur.route.ref!==n.route.ref){if(cur)out.push(cur);cur={route:n.route,stops:[n.stop]}}else cur.stops.push(n.stop)}if(cur)out.push(cur);return out}
async function roadLine(stops){try{const u='https://router.project-osrm.org/route/v1/driving/'+stops.map(p=>p.lon+','+p.lat).join(';')+'?overview=full&geometries=geojson';const j=await getJSON(u,{},15000);return j.routes?.[0]?.geometry?.coordinates?.map(p=>[p[1],p[0]])||null}catch{return null}}
async function draw(A,B,t){clearMap();const pts=[[A.lat,A.lon],[B.lat,B.lon]];layers.push(L.marker([A.lat,A.lon]).addTo(map).bindPopup(A.label),L.marker([B.lat,B.lon]).addTo(map).bindPopup(B.label));for(const s of segments(t.path)){const line=await roadLine(s.stops)||s.stops.map(p=>[p.lat,p.lon]);const poly=L.polyline(line,{weight:6,opacity:.9}).addTo(map);layers.push(poly);s.stops.forEach(p=>{const m=L.circleMarker([p.lat,p.lon],{radius:4,weight:1}).addTo(map).bindTooltip(p.name);layers.push(m)});pts.push(...line)}map.fitBounds(L.latLngBounds(pts),{padding:[30,30]})}
function render(A,B,t){const ss=segments(t.path);let h='<div style="font-size:18px;font-weight:950">'+esc(A.label)+' → '+esc(B.label)+'</div><div class="small">≈ '+t.minutes+' min indicatives · '+ss.length+' ligne'+(ss.length>1?'s':'')+'</div>';ss.forEach((s,i)=>{const a=s.stops[0],b=s.stops[s.stops.length-1];if(i>0)h+='<div class="progress">🔄 <b>Correspondance</b> à '+esc(a.name)+'</div>';h+='<div class="step"><b>🚌 Ligne '+esc(s.route.ref)+'</b><div class="small">'+esc(a.name)+' → '+esc(b.name)+'</div><div class="small">'+s.stops.length+' arrêts sur ce segment</div></div>'});h+='<button class="follow" id="follow">📍 Suivre ma progression</button><div id="progress" class="progress hidden"></div>';return h}
function updateProgress(){if(!currentTrip||!userPos)return;const stops=currentTrip.path.map(n=>n.stop),idx=stops.reduce((best,s,i)=>dist(userPos,s)<dist(userPos,stops[best])?i:best,0),next=stops[Math.min(idx+1,stops.length-1)];$('progress').classList.remove('hidden');$('progress').innerHTML='📍 <b>Avancement</b><br>Arrêt le plus proche : '+esc(stops[idx].name)+'<br>Prochain arrêt : '+esc(next.name)+'<br>'+Math.max(0,stops.length-1-idx)+' arrêts restants';}
function startFollow(){if(watchId!==null)return;watchId=navigator.geolocation.watchPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude,label:'Ma position'};updateProgress()},()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000});updateProgress()}
$('go').onclick=async()=>{const btn=$('go');btn.disabled=true;btn.textContent='Recherche…';$('result').innerHTML='<b>🔎 Recherche des correspondances…</b><div class="small">SegaMap cherche les meilleurs enchaînements de lignes.</div>';try{const A=await resolveInput($('from')),B=await resolveInput($('to'));if(!A||!B)throw Error('Lieu introuvable');if(norm($('from').value)==='ma position'&&!userPos)userPos=A;const t=solve(A,B);if(!t){$('result').innerHTML='<b class="err">Aucun trajet bus confirmé.</b><div class="small">Les données de certains parcours restent incomplètes. Réessaie avec un arrêt ou un grand lieu proche.</div>';return}currentTrip=t;$('result').innerHTML=render(A,B,t);$('follow').onclick=startFollow;await draw(A,B,t)}catch(e){$('result').innerHTML='<b class="err">Impossible de calculer ce trajet.</b><div class="small">'+esc(e.message||'Erreur inconnue')+'</div>'}finally{btn.disabled=false;btn.textContent='Trouver le meilleur trajet'}};
(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}await loadNLTA();await loadOSM();$('status').innerHTML='<span class="ok">✓ '+routes.length+' parcours routables chargés · '+nltaCount+' lignes NLTA au catalogue</span>'}catch{$('status').innerHTML='<span class="warn">Réseau local de secours chargé.</span>'}})();
</script></body></html>
