<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><title>MauriMove 🇲🇺</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef1f5;color:#101828}#map{position:fixed;inset:0}.panel{position:fixed;z-index:10;left:12px;top:12px;width:min(500px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:#fffffff2;backdrop-filter:blur(18px);border-radius:24px;padding:16px;box-shadow:0 20px 70px #0003}.brand{font-size:28px;font-weight:950}.brand span{color:#ff5a36}.sub,.small{font-size:12px;color:#667085;line-height:1.45}.search{background:#fff;border:1px solid #e4e7ec;border-radius:16px;overflow:hidden;margin-top:14px}.field{display:flex;gap:10px;padding:13px}.field+.field{border-top:1px solid #eee}.dot{width:10px;height:10px;border-radius:50%;background:#ff5a36;margin-top:5px}.blue{background:#246bfd}input{border:0;outline:0;width:100%;font-size:15px}.bar{display:flex;gap:7px;margin-top:8px}.btn{flex:1;border:1px solid #d0d5dd;background:#fff;border-radius:11px;padding:10px;font-weight:800}.go{width:100%;border:0;background:#101828;color:#fff;border-radius:14px;padding:14px;margin-top:8px;font-weight:900}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px;margin-top:9px}.best{border:2px solid #ff5a36}.big{font-size:18px;font-weight:950}.step{padding:10px 0;border-bottom:1px solid #eee}.step:last-child{border:0}.warn{background:#fffaeb;color:#b54708;border-radius:10px;padding:9px;font-size:11px;margin-top:8px}.ok{color:#067647;font-weight:900}.err{color:#b42318;font-weight:900}.badge{display:inline-block;background:#eef4ff;color:#175cd3;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}</style></head><body><div id="map"></div><section class="panel"><div class="brand">Mauri<span>Move</span> 🇲🇺</div><div class="sub">Calculateur de transport pour toute l’île</div><div class="search"><div class="field"><span class="dot"></span><input id="from" value="Ma position" placeholder="Départ"></div><div class="field"><span class="dot blue"></span><input id="to" placeholder="Destination"></div></div><div class="bar"><button class="btn" id="gps">⌖ Ma position</button><button class="btn" id="swap">⇅ Inverser</button></div><button class="go" id="go">Trouver le meilleur trajet</button><div id="result" class="card"><b>Prêt 😊</b><div class="small">Entre un départ et une destination. MauriMove ne proposera un trajet que si la séquence des arrêts est confirmée.</div></div><div class="card"><span id="network" class="badge">Réseau en chargement…</span><div id="status" class="small" style="margin-top:7px">Chargement…</div></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const OVERPASS='https://overpass-api.de/api/interpreter',NOM='https://nominatim.openstreetmap.org/search',FOOT='https://routing.openstreetmap.de/routed-foot/route/v1/driving/';const map=L.map('map').setView([-20.3484,57.5522],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const $=x=>document.getElementById(x);let routes=[],stops=[],pos=null,marks=[];
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dist(a,b){return Math.hypot((a.lat-b.lat)*111,(a.lon-b.lon)*104)}async function get(u,o){let r=await fetch(u,o);if(!r.ok)throw Error(r.status);return r.json()}
async function load(){try{$('status').textContent='Chargement des lignes et arrêts…';let q='[out:json][timeout:90];rel["type"="route"]["route"="bus"](-20.55,57.25,-19.95,57.85);out body;>;out skel qt;';let z=await get(OVERPASS,{method:'POST',body:new URLSearchParams({data:q})});let nodes=new Map(),rels=[];z.elements.forEach(e=>{if(e.type==='node'&&e.lat!==undefined)nodes.set(e.id,{id:e.id,lat:e.lat,lon:e.lon,name:e.tags?.name||'Arrêt de bus'});if(e.type==='relation')rels.push(e)});let seen=new Set();routes=[];stops=[];rels.forEach(r=>{let t=r.tags||{},ids=(r.members||[]).filter(m=>m.type==='node'&&['stop','platform','stop_entry_only','platform_entry_only','stop_exit_only','platform_exit_only'].includes(m.role)&&nodes.has(m.ref)).map(m=>m.ref);ids=[...new Set(ids)];if(ids.length<2)return;let ss=ids.map(id=>nodes.get(id)),key=(t.ref||r.id)+'|'+ids.join(',');if(seen.has(key))return;seen.add(key);let ri=routes.length;routes.push({ref:t.ref||t.name||String(r.id),from:t.from||'',to:t.to||'',operator:t.operator||'',stops:ss});ss.forEach(s=>stops.push({...s,route:ri}))});$('network').textContent=routes.length+' variantes';$('status').innerHTML='<span class="ok">✓ '+stops.length+' arrêts liés aux lignes</span>'}catch(e){$('network').textContent='indisponible';$('status').innerHTML='<span class="err">Le réseau bus n’a pas pu être chargé.</span>'}}
async function geo(q){try{let a=await get(NOM+'?format=jsonv2&limit=1&countrycodes=mu&q='+encodeURIComponent(q+', Mauritius'),{headers:{'Accept-Language':'fr'}});return a[0]?{lat:+a[0].lat,lon:+a[0].lon,label:q}:null}catch(e){return null}}function getPos(){return new Promise(res=>navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude,label:'Ma position'};res(pos)},()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:30000}))}async function resolve(q){return norm(q)==='ma position'?(pos||await getPos()):geo(q)}function near(p,k=12){return stops.map(s=>({...s,d:dist(p,s)})).sort((a,b)=>a.d-b.d).slice(0,k)}async function walk(a,b){try{let j=await get(FOOT+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=false&steps=false');if(j.routes?.[0])return{min:Math.max(1,Math.round(j.routes[0].duration/60)),m:Math.round(j.routes[0].distance)}}catch(e){}return{min:Math.max(1,Math.round(dist(a,b)/5*60)),m:Math.round(dist(a,b)*1000)}}
function direct(A,B){let out=[];for(let a of near(A))for(let b of near(B)){if(a.route!==b.route)continue;let r=routes[a.route],i=r.stops.findIndex(s=>s.id===a.id),j=r.stops.findIndex(s=>s.id===b.id);if(i>=0&&j>i)out.push({r,a,b,i,j})}return out.sort((x,y)=>x.a.d+x.b.d-(y.a.d+y.b.d))}
function transfers(A,B){let aa=near(A,10),bb=near(B,10),out=[];for(let a of aa)for(let b of bb){for(let r1 of [...new Set(aa.filter(x=>x.id===a.id).map(x=>x.route))]){let R1=routes[r1],i=R1.stops.findIndex(s=>s.id===a.id);for(let r2 of [...new Set(bb.filter(x=>x.id===b.id).map(x=>x.route))]){if(r1===r2)continue;let R2=routes[r2],j=R2.stops.findIndex(s=>s.id===b.id);if(j<0)continue;for(let k=i+1;k<R1.stops.length;k++){let tr=R1.stops[k],k2=R2.stops.findIndex(s=>s.id===tr.id);if(k2>=0&&k2<j)out.push({r1:R1,r2:R2,a,b,tr,i,k,k2,j})}}}}return out.slice(0,5)}function clear(){marks.forEach(m=>m.remove());marks=[]}function draw(p){clear();marks.push(L.polyline(p,{color:'#246bfd',weight:5}).addTo(map));marks.push(L.polyline([p[0],p[1]],{color:'#ff5a36',weight:4,dashArray:'6 7'}).addTo(map));marks.push(L.polyline([p[p.length-2],p[p.length-1]],{color:'#ff5a36',weight:4,dashArray:'6 7'}).addTo(map));map.fitBounds(p,{padding:[70,70]})}
async function calc(){ $('go').disabled=true;$('go').textContent='Recherche…';$('result').innerHTML='<b>🔎 Recherche…</b><div class="small">Arrêts accessibles → lignes → séquence réelle → correspondances.</div>';let A=await resolve($('from').value.trim()),B=await resolve($('to').value.trim());if(!A||!B){$('result').innerHTML='<b>Départ ou destination introuvable.</b>';finish();return}if(!routes.length)await load();let ds=direct(A,B);if(ds.length){let x=ds[0],w1=await walk(A,x.a),w2=await walk(x.b,B);draw([[A.lat,A.lon],[x.a.lat,x.a.lon],...x.r.stops.slice(x.i,x.j+1).map(s=>[s.lat,s.lon]),[B.lat,B.lon]]);$('result').innerHTML='<div class="best card"><div class="big">⭐ Ligne '+esc(x.r.ref)+'</div><div class="small">'+esc(x.r.from)+' → '+esc(x.r.to)+'</div><div class="step">🚶 <b>'+esc(x.a.name)+'</b><div class="small">'+w1.min+' min · '+w1.m+' m</div></div><div class="step">🚌 <b>'+esc(x.a.name)+' → '+esc(x.b.name)+'</b><div class="small">Séquence des arrêts confirmée. Aucun temps bus inventé.</div></div><div class="step">🚶 <b>'+esc(x.b.name)+'</b><div class="small">'+w2.min+' min · '+w2.m+' m</div></div></div><div class="warn">⚠️ Les horaires/temps de parcours ne sont affichés que lorsqu’ils sont confirmés par les données officielles correspondantes.</div>';finish();return}let ts=transfers(A,B);if(ts.length){$('result').innerHTML='<b>🔄 Correspondance potentielle détectée</b><div class="small">'+esc(ts[0].r1.ref)+' → '+esc(ts[0].tr.name)+' puis '+esc(ts[0].r2.ref)+' → '+esc(ts[0].b.name)+'.</div><div class="warn">Je ne l’affiche pas encore comme “meilleur trajet” : il faut confirmer la correspondance et les horaires avec les données NLTA. Aucun faux itinéraire.</div>';finish();return}$('result').innerHTML='<b>Aucun trajet confirmé.</b><div class="small">Aucune séquence de lignes/arrêts actuellement vérifiable pour ce trajet.</div>';finish()}
function finish(){$('go').disabled=false;$('go').textContent='Trouver le meilleur trajet'}$('gps').onclick=async()=>{let p=await getPos();if(p){$('from').value='Ma position';map.setView([p.lat,p.lon],15)}};$('swap').onclick=()=>{let a=$('from').value;$('from').value=$('to').value;$('to').value=a};$('go').onclick=calc;load();</script></body></html>
