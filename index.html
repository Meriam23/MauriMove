<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EA1C24"><title>MauriMove 🇲🇺</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--red:#EA1C24;--blue:#0072CE;--yellow:#FFD500;--green:#00A651;--ink:#101828;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#eef1f5;color:var(--ink)}#map{position:fixed;inset:0}.panel{position:fixed;z-index:20;left:12px;top:12px;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fffffff5;backdrop-filter:blur(20px);border-radius:25px;padding:16px;box-shadow:0 20px 70px #0003}.brand{font-size:28px;font-weight:950}.r{color:var(--red)}.b{color:var(--blue)}.sub,.small{font-size:12px;color:var(--muted);line-height:1.45}.sub{margin:2px 0 14px}.search{background:#fff;border:1px solid #e4e7ec;border-radius:17px;overflow:visible}.field{display:flex;gap:10px;padding:13px;position:relative}.field+.field{border-top:1px solid #eaecf0}.dot{width:10px;height:10px;border-radius:50%;background:var(--red);margin-top:5px;flex:none}.dot.blue{background:var(--blue)}input{border:0;outline:0;width:100%;font-size:16px;background:transparent}.suggestions{position:absolute;left:35px;right:10px;top:46px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 15px 40px #0002;overflow:hidden;z-index:50}.suggestion{display:block;width:100%;border:0;background:#fff;text-align:left;padding:12px 14px;border-bottom:1px solid #f2f4f7}.suggestion b{font-size:13px}.suggestion span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.actions{display:flex;gap:7px;margin-top:8px}.btn{flex:1;border:1px solid #d0d5dd;background:#fff;border-radius:11px;padding:10px;font-weight:850}.go{width:100%;border:0;background:var(--red);color:#fff;border-radius:14px;padding:14px;margin-top:8px;font-weight:950}.mapBtn{position:fixed;right:16px;bottom:24px;z-index:30;border:0;background:#fff;border-radius:14px;padding:12px 15px;font-weight:900;box-shadow:0 8px 30px #0003}.title{font-size:12px;font-weight:950;margin:14px 0 7px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px;margin-top:8px}.best{border:2px solid var(--green)}.big{font-size:18px;font-weight:950}.step{padding:10px 0;border-bottom:1px solid #eee}.step:last-child{border:0}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:950;background:#e8f5ee;color:#067647}.warn{background:#fff8df;color:#8a6500;border-radius:11px;padding:10px;font-size:11px;line-height:1.4;margin-top:8px}.ok{color:#067647;font-weight:900}.err{color:#b42318;font-weight:900}.source{font-size:10px;color:#667085;margin-top:8px}.pinMode{background:#fff8df!important;border:2px solid var(--yellow)!important}</style></head><body><div id="map"></div><section class="panel"><div class="brand"><span class="r">Mauri</span><span class="b">Move</span> 🇲🇺</div><div class="sub">Le calculateur de transport de l’île Maurice</div><div class="search"><div class="field"><span class="dot"></span><input id="from" value="Ma position" placeholder="Départ"><div id="fromSug" class="suggestions" hidden></div></div><div class="field"><span class="dot blue"></span><input id="to" placeholder="Où allez-vous ?"><div id="toSug" class="suggestions" hidden></div></div></div><div class="actions"><button class="btn" id="gps">⌖ Ma position</button><button class="btn" id="pick">📍 Choisir sur la carte</button><button class="btn" id="swap">⇅ Inverser</button></div><button class="go" id="go">Trouver le meilleur trajet</button><div class="title">Itinéraires</div><div id="result" class="card"><b>Prêt 😊</b><div class="small">Tape un lieu, choisis une suggestion ou sélectionne directement un point sur la carte.</div></div><div class="title">Données transport</div><div class="card"><span id="network" class="badge">NLTA : chargement…</span><div id="status" class="small">Chargement des données officielles.</div><div class="source">Source officielle : National Land Transport Authority (NLTA).</div></div></section><button id="mapBtn" class="mapBtn" hidden>📍 Sélectionner ce point</button><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const NOM='https://nominatim.openstreetmap.org/search',OVERPASS='https://overpass-api.de/api/interpreter',ROAD='https://router.project-osrm.org/route/v1/driving/',FOOT='https://routing.openstreetmap.de/routed-foot/route/v1/driving/';const map=L.map('map').setView([-20.3484,57.5522],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const $=id=>document.getElementById(id);let routes=[],stops=[],nlta={},pos=null,marks=[],pickMode=false,pickPoint=null,pickMarker=null;const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dist=(a,b)=>Math.hypot((a.lat-b.lat)*111,(a.lon-b.lon)*104);async function get(u,o={}){const r=await fetch(u,o);if(!r.ok)throw Error(r.status);return r.json()}async function loadNLTA(){try{const d=await get('./data/nlta-routes.json?'+Date.now());nlta={};(d.routes||[]).forEach(r=>nlta[String(r.route).trim().toUpperCase()]=r);$('network').textContent=Object.keys(nlta).length+' lignes NLTA';$('status').innerHTML='<span class="ok">✓ Données officielles NLTA intégrées</span>'}catch(e){nlta={};$('network').textContent='NLTA indisponible';$('status').innerHTML='<span class="err">Les données NLTA ne sont pas encore publiées.</span>'}}async function loadOSM(){try{const q='[out:json][timeout:90];rel["type"="route"]["route"="bus"](-20.55,57.25,-19.95,57.85);out body;>;out skel qt;';const z=await get(OVERPASS,{method:'POST',body:new URLSearchParams({data:q})});const nodes=new Map(),rels=[];z.elements.forEach(e=>{if(e.type==='node'&&e.lat!==undefined)nodes.set(e.id,{id:e.id,lat:e.lat,lon:e.lon,name:e.tags?.name||'Arrêt de bus'});if(e.type==='relation')rels.push(e)});const seen=new Set();routes=[];stops=[];rels.forEach(r=>{const t=r.tags||{},ids=[...new Set((r.members||[]).filter(m=>m.type==='node'&&['stop','platform','stop_entry_only','platform_entry_only','stop_exit_only','platform_exit_only'].includes(m.role)&&nodes.has(m.ref)).map(m=>m.ref))];if(ids.length<2)return;const ss=ids.map(id=>nodes.get(id));const ref=String(t.ref||'').trim().toUpperCase();const key=(ref||r.id)+'|'+ids.join(',');if(seen.has(key))return;seen.add(key);const ri=routes.length;routes.push({ref:ref||t.name||String(r.id),from:t.from||'',to:t.to||'',operator:t.operator||'',stops:ss,nlta:nlta[ref]||null});ss.forEach(s=>stops.push({...s,route:ri}))});$('status').innerHTML='<span class="ok">✓ '+routes.length+' variantes OSM reliées au réseau</span>'+(Object.keys(nlta).length?' · NLTA active':'')}catch(e){$('status').innerHTML='<span class="err">Réseau cartographique indisponible.</span>'}}async function load(){await loadNLTA();await loadOSM()}async function geo(q,limit=7){try{const a=await get(NOM+'?format=jsonv2&addressdetails=1&limit='+limit+'&countrycodes=mu&q='+encodeURIComponent(q+', Mauritius'),{headers:{'Accept-Language':'fr'}});return a.map(x=>({lat:+x.lat,lon:+x.lon,label:x.name||x.display_name.split(',')[0],address:x.display_name}))}catch(e){return[]}}function picker(input,box){let timer;input.addEventListener('input',()=>{delete input.dataset.lat;delete input.dataset.lon;clearTimeout(timer);const q=input.value.trim();if(q.length<2){box.hidden=true;return}timer=setTimeout(async()=>{const data=await geo(q);box.innerHTML='';if(!data.length)box.innerHTML='<div class="suggestion"><span>Aucun lieu trouvé à Maurice.</span></div>';data.forEach(x=>{const b=document.createElement('button');b.className='suggestion';b.innerHTML='<b>📍 '+esc(x.label)+'</b><span>'+esc(x.address)+'</span>';b.onclick=()=>{input.value=x.label;input.dataset.lat=x.lat;input.dataset.lon=x.lon;input.dataset.label=x.label;box.hidden=true};box.appendChild(b)});box.hidden=false},220)});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!box.hidden){const b=box.querySelector('button');if(b){e.preventDefault();b.click()}}})}picker($('from'),$('fromSug'));picker($('to'),$('toSug'));function getPos(){return new Promise(res=>navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude,label:'Ma position'};res(pos)},()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:30000}))}async function resolve(input){if(norm(input.value)==='ma position')return pos||await getPos();if(input.dataset.lat)return{lat:+input.dataset.lat,lon:+input.dataset.lon,label:input.dataset.label||input.value};const a=await geo(input.value,1);return a[0]||null}function near(p,k=18){return stops.map(s=>({...s,d:dist(p,s)})).sort((a,b)=>a.d-b.d).slice(0,k)}function direct(A,B){const out=[];for(const a of near(A))for(const b of near(B))if(a.route===b.route){const r=routes[a.route],i=r.stops.findIndex(s=>s.id===a.id),j=r.stops.findIndex(s=>s.id===b.id);if(i>=0&&j>i)out.push({r,a,b,i,j})}return out.sort((x,y)=>x.a.d+x.b.d-y.a.d-y.b.d).slice(0,5)}async function walk(a,b){try{const j=await get(FOOT+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=false&steps=false');if(j.routes?.[0])return{min:Math.max(1,Math.round(j.routes[0].duration/60)),m:Math.round(j.routes[0].distance)}}catch(e){}const m=dist(a,b);return{min:Math.max(1,Math.round(m/5*60)),m:Math.round(m*1000)}}function clear(){marks.forEach(x=>x.remove());marks=[]}async function draw(points){clear();const fallback=L.polyline(points,{color:'#0072CE',weight:5,opacity:.6}).addTo(map);marks.push(fallback);try{const j=await get(ROAD+points.map(p=>p[1]+','+p[0]).join(';')+'?overview=full&geometries=geojson&steps=false');const c=j.routes?.[0]?.geometry?.coordinates;if(c){fallback.remove();const ll=c.map(p=>[p[1],p[0]]);marks.push(L.polyline(ll,{color:'#0072CE',weight:5}).addTo(map));map.fitBounds(ll,{padding:[70,70]});return}}catch(e){}map.fitBounds(points,{padding:[70,70]})}async function calc(){const btn=$('go');btn.disabled=true;btn.textContent='Recherche…';$('result').innerHTML='<b>🔎 Recherche…</b><div class="small">Lieu → marche → arrêt → ligne NLTA → arrêts → destination.</div>';const A=await resolve($('from')),B=await resolve($('to'));if(!A||!B){$('result').innerHTML='<b>Lieu introuvable.</b><div class="small">Choisis une suggestion.</div>';return finish()}if(!routes.length)await load();const ds=direct(A,B);if(!ds.length){$('result').innerHTML='<b>Aucun trajet de bus confirmé.</b><div class="small">Aucune ligne cartographiée ne relie actuellement ces deux zones avec un ordre d’arrêts vérifiable. Je ne vais pas inventer un trajet.</div><div class="warn">Les données NLTA sont intégrées pour identifier les lignes officielles ; le rapprochement complet NLTA ↔ coordonnées de chaque arrêt reste nécessaire pour garantir tout le réseau.</div>';return finish()}const x=ds[0],w1=await walk(A,x.a),w2=await walk(x.b,B),pts=[[A.lat,A.lon],[x.a.lat,x.a.lon],...x.r.stops.slice(x.i,x.j+1).map(s=>[s.lat,s.lon]),[B.lat,B.lon]];await draw(pts);const ref=String(x.r.ref).toUpperCase(),n=nlta[ref];$('result').innerHTML='<div class="card best"><div class="big">⭐ Ligne '+esc(ref)+'</div><div class="small">'+esc(n?.operator||x.r.operator||'Opérateur non précisé')+(n?.description?' · '+esc(n.description):'')+'</div><div class="step">🚶 <b>Vers '+esc(x.a.name)+'</b><div class="small">'+w1.min+' min · '+w1.m+' m</div></div><div class="step">🚌 <b>'+esc(x.a.name)+' → '+esc(x.b.name)+'</b><div class="small">Ordre des arrêts vérifié. Ligne rapprochée aux données NLTA.</div></div><div class="step">🚶 <b>Destination</b><div class="small">'+w2.min+' min · '+w2.m+' m</div></div></div><div class="warn">⏱️ Aucun ETA inventé. Les horaires NLTA seront utilisés dès que leur structure est reliée aux arrêts et aux jours de circulation.</div>';finish()}function finish(){$('go').disabled=false;$('go').textContent='Trouver le meilleur trajet'}$('gps').onclick=async()=>{const p=await getPos();if(p){$('from').value='Ma position';map.setView([p.lat,p.lon],15)}};$('pick').onclick=()=>{pickMode=!pickMode;$('pick').classList.toggle('pinMode',pickMode);$('mapBtn').hidden=!pickMode;$('result').innerHTML='<b>📍 Mode sélection sur la carte</b><div class="small">Touchez n’importe quel point sur la carte. MauriMove utilisera ses coordonnées comme départ ou destination.</div>'};map.on('click',e=>{if(!pickMode)return;pickPoint={lat:e.latlng.lat,lon:e.latlng.lng,label:'Point sélectionné'};if(pickMarker)pickMarker.remove();pickMarker=L.marker([pickPoint.lat,pickPoint.lon]).addTo(map).bindPopup('Point sélectionné').openPopup();$('mapBtn').hidden=false});$('mapBtn').onclick=()=>{if(!pickPoint)return;const target=norm($('from').value)==='ma position'||!$('from').dataset.lat&&!$('from').value.trim()?$('to'):$('from');target.value='Point sélectionné';target.dataset.lat=pickPoint.lat;target.dataset.lon=pickPoint.lon;target.dataset.label='Point sélectionné';pickMode=false;$('pick').classList.remove('pinMode');$('mapBtn').hidden=true;$('result').innerHTML='<b>📍 Point sélectionné</b><div class="small">Il a été ajouté comme '+(target.id==='to'?'destination.':'départ.')+'</div>'};$('swap').onclick=()=>{const a=$('from').value,al=$('from').dataset.lat,ao=$('from').dataset.lon,an=$('from').dataset.label;$('from').value=$('to').value;$('from').dataset.lat=$('to').dataset.lat||'';$('from').dataset.lon=$('to').dataset.lon||'';$('from').dataset.label=$('to').dataset.label||'';$('to').value=a;$('to').dataset.lat=al||'';$('to').dataset.lon=ao||'';$('to').dataset.label=an||''};$('go').onclick=calc;load();</script></body></html>
