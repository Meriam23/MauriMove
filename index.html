<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06143F"><meta name="description" content="SegaMap — planificateur de transport public à Maurice.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./segamap-logo.svg"><title>SegaMap 🇲🇺</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#101828;background:#eaf0f5}#map{position:fixed;inset:0}.panel{position:fixed;z-index:1000;left:12px;top:12px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fffffff2;backdrop-filter:blur(18px);border-radius:26px;padding:16px;box-shadow:0 18px 70px #0003}.brand{display:flex;align-items:center;gap:9px;font-size:29px;font-weight:950;letter-spacing:-1px}.logo{width:42px;height:42px;border-radius:11px;object-fit:cover}.name{color:#06143f}.sub{font-size:12px;color:#667085;margin:2px 0 14px}.search{border:1px solid #e4e7ec;border-radius:18px;background:#fff;overflow:visible}.field{position:relative;display:flex;gap:10px;padding:13px}.field+.field{border-top:1px solid #eef0f3}.dot{width:10px;height:10px;border-radius:50%;background:#ef233c;margin-top:5px;flex:none}.dot.blue{background:#0072ce}input{border:0;outline:0;width:100%;font-size:16px;background:transparent;color:#101828}.suggestions{position:absolute;z-index:2000;left:34px;right:10px;top:48px;background:#fff;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 15px 45px #0002;overflow:hidden}.suggestion{display:block;width:100%;border:0;background:#fff;text-align:left;padding:12px 14px;border-bottom:1px solid #f2f4f7}.suggestion:last-child{border:0}.suggestion b{font-size:13px}.suggestion span{display:block;font-size:11px;color:#667085;margin-top:3px}.actions{display:flex;gap:7px;margin-top:8px}.btn{flex:1;border:1px solid #d0d5dd;background:#fff;border-radius:12px;padding:10px 8px;font-weight:850}.btn.active{border-color:#ffd500;background:#fff8df}.go{width:100%;border:0;background:linear-gradient(90deg,#ef233c,#0072ce);color:#fff;border-radius:14px;padding:14px;margin-top:8px;font-weight:950;font-size:15px}.go:disabled{opacity:.65}.title{font-size:12px;font-weight:950;margin:14px 0 7px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px}.route{border:2px solid #00a651}.big{font-size:18px;font-weight:950}.step{padding:10px 0;border-bottom:1px solid #eee}.step:last-child{border:0}.small{font-size:12px;color:#667085;line-height:1.45}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:950;background:#e8f5ee;color:#067647}.warn{background:#fff8df;color:#8a6500;border-radius:11px;padding:10px;font-size:11px;line-height:1.4;margin-top:8px}.ok{color:#067647;font-weight:900}.err{color:#b42318;font-weight:900}.mapBtn{position:fixed;right:16px;bottom:24px;z-index:3000;border:0;background:#fff;border-radius:14px;padding:12px 15px;font-weight:900;box-shadow:0 8px 30px #0003}.hidden{display:none!important}
</style></head>
<body><div id="map"></div>
<section class="panel">
<div class="brand"><img class="logo" src="./segamap-logo.svg" alt="SegaMap"><span class="name">SegaMap</span><span>🇲🇺</span></div>
<div class="sub">Le transport mauricien, pensé pour toute l’île.</div>
<div class="search"><div class="field"><span class="dot"></span><input id="from" value="Ma position" placeholder="Départ" autocomplete="off"><div id="fromSug" class="suggestions hidden"></div></div><div class="field"><span class="dot blue"></span><input id="to" placeholder="Où allez-vous ?" autocomplete="off"><div id="toSug" class="suggestions hidden"></div></div></div>
<div class="actions"><button class="btn" id="gps">⌖ Ma position</button><button class="btn" id="pick">📍 Carte</button><button class="btn" id="swap">⇅ Inverser</button></div>
<button class="go" id="go">Trouver le meilleur trajet</button>
<div class="title">Itinéraire</div><div id="result" class="card"><b>Prêt 😊</b><div class="small">Choisis une destination. Le moteur n’affiche que les trajets qu’il peut établir avec les données disponibles.</div></div>
<div class="title">Réseau mauricien</div><div class="card"><span id="network" class="badge">Chargement…</span><div id="status" class="small" style="margin-top:7px">Préparation du réseau.</div></div>
</section><button id="mapBtn" class="mapBtn hidden">📍 Utiliser ce point</button>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=L.map('map').setView([-20.3484,57.5522],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let routes=[],stops=[],nlta={},userPos=null,layers=[],pickMode=false,picked=null,pickedMarker=null;
const LOCAL=[{keys:['c care tamarin','c care','c-care tamarin'],label:'C-Care Tamarin',address:'Tamarin, Mauritius',lat:-20.3258,lon:57.3819},{keys:['cascavelle','cascavelle shopping mall','cascavelle mall'],label:'Cascavelle Shopping Mall',address:'Cascavelle, Mauritius',lat:-20.2856,lon:57.4001},{keys:['carrefour flic en flac','carrefour flic-en-flac','carrefour city flic en flac'],label:'Carrefour City Flic-en-Flac',address:'Flic-en-Flac, Mauritius',lat:-20.2749,lon:57.3742},{keys:['wolmar'],label:'Wolmar',address:'Wolmar, Mauritius',lat:-20.321,lon:57.369},{keys:['port louis bus station','victoria bus station','immigration square'],label:'Port Louis Bus Station',address:'Port Louis, Mauritius',lat:-20.164,lon:57.501}];
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function fetchJson(url,opts={},ms=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opts,signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
function localSearch(q){const n=norm(q);return LOCAL.filter(x=>x.keys.some(k=>k.includes(n)||n.includes(k))).slice(0,6)}
async function searchPlace(q){const local=localSearch(q);if(local.length)return local;try{const d=await fetchJson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=mu&q='+encodeURIComponent(q+', Mauritius'),{headers:{'Accept-Language':'fr'}},6000);return d.map(x=>({lat:+x.lat,lon:+x.lon,label:x.name||x.display_name.split(',')[0],address:x.display_name}))}catch{return[]}}
function suggestions(input,box){let timer;input.addEventListener('input',()=>{delete input.dataset.lat;delete input.dataset.lon;delete input.dataset.label;clearTimeout(timer);const q=input.value.trim();if(q.length<2){box.classList.add('hidden');return}timer=setTimeout(async()=>{box.innerHTML='';const data=await searchPlace(q);if(!data.length)box.innerHTML='<div class="suggestion"><span>Aucun lieu trouvé à Maurice.</span></div>';else data.forEach(x=>{const b=document.createElement('button');b.className='suggestion';b.innerHTML='<b>📍 '+esc(x.label)+'</b><span>'+esc(x.address)+'</span>';b.onclick=()=>{input.value=x.label;input.dataset.lat=x.lat;input.dataset.lon=x.lon;input.dataset.label=x.label;box.classList.add('hidden')};box.appendChild(b)});box.classList.remove('hidden')},250)});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!box.classList.contains('hidden')){const b=box.querySelector('button');if(b){e.preventDefault();b.click()}}})}suggestions($('from'),$('fromSug'));suggestions($('to'),$('toSug'));
async function position(){if(!navigator.geolocation)return null;return new Promise(resolve=>navigator.geolocation.getCurrentPosition(p=>{userPos={lat:p.coords.latitude,lon:p.coords.longitude,label:'Ma position'};resolve(userPos)},()=>resolve(null),{enableHighAccuracy:true,timeout:9000,maximumAge:30000}))}async function resolveInput(input){if(norm(input.value)==='ma position')return userPos||position();if(input.dataset.lat)return{lat:+input.dataset.lat,lon:+input.dataset.lon,label:input.dataset.label||input.value};const a=await searchPlace(input.value);return a[0]||null}
function dist(a,b){return Math.hypot((a.lat-b.lat)*111,(a.lon-b.lon)*104)}function walkMin(km){return Math.max(1,Math.round(km*60/5))}function busMin(km){return Math.max(1,Math.round(km*60/19))}function clearMap(){layers.forEach(x=>{try{x.remove()}catch{}});layers=[]}
async function road(points){if(points.length<2)return null;try{const u='https://router.project-osrm.org/route/v1/driving/'+points.map(p=>p.lon+','+p.lat).join(';')+'?overview=full&geometries=geojson&steps=false',j=await fetchJson(u,{},10000),c=j.routes?.[0]?.geometry?.coordinates;return c?c.map(p=>[p[1],p[0]]):null}catch{return null}}
async function loadNLTA(){try{const d=await fetchJson('./data/nlta-routes.json?v=20260815',{},7000);nlta={};(d.routes||[]).forEach(r=>nlta[String(r.route).trim().toUpperCase()]=r);$('network').textContent=(d.route_count||Object.keys(nlta).length)+' lignes NLTA';return true}catch{$('network').textContent='NLTA indisponible';return false}}
async function parseOSM(z){const nodes=new Map(),rels=[];(z.elements||[]).forEach(e=>{if(e.type==='node'&&e.lat!==undefined)nodes.set(e.id,{id:e.id,lat:+e.lat,lon:+e.lon,name:e.tags?.name||'Arrêt de bus'});if(e.type==='relation')rels.push(e)});const out=[],seen=new Set();for(const r of rels){const t=r.tags||{},ids=[];for(const m of r.members||[])if(m.type==='node'&&nodes.has(m.ref)&&['stop','platform','stop_entry_only','platform_entry_only','stop_exit_only','platform_exit_only'].includes(m.role))ids.push(m.ref);const uniq=[...new Set(ids)];if(uniq.length<2)continue;const ref=String(t.ref||'').trim().toUpperCase(),key=(ref||r.id)+'|'+uniq.join(',');if(seen.has(key))continue;seen.add(key);out.push({ref:ref||t.name||String(r.id),from:t.from||'',to:t.to||'',operator:t.operator||'',stops:uniq.map(id=>nodes.get(id)).filter(Boolean),nlta:nlta[ref]||null})}return out}
async function loadOSM(){const q='[out:json][timeout:25];rel["type"="route"]["route"="bus"](-20.55,57.25,-19.95,57.85);out body;>;out skel qt;';for(const ep of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const z=await fetchJson(ep,{method:'POST',body:new URLSearchParams({data:q})},12000),out=await parseOSM(z);if(out.length){routes=out;stops=[];routes.forEach((r,ri)=>r.stops.forEach(s=>stops.push({...s,route:ri})));$('status').innerHTML='<span class="ok">✓ '+routes.length+' parcours bus chargés</span> · '+Object.keys(nlta).length+' lignes NLTA';return true}}catch{}}return false}
async function loadFallback57(){try{const d=await fetchJson('./data/transit/route-57.json?v=20260815',{},6000),dirs=[];for(const dir of d.directions||[]){const ss=[];for(const s of dir.stops||[]){let f=localSearch(s.name)[0];if(!f){const a=await searchPlace(s.name);f=a[0]}if(f)ss.push({id:dir.direction_id+'-'+s.sequence,lat:f.lat,lon:f.lon,name:s.name,journey_minutes:s.journey_minutes});await sleep(350)}if(ss.length>=2)dirs.push({ref:d.route_id,from:dir.origin,to:dir.destination,stops:ss,nlta:dir})}if(dirs.length){routes=dirs;stops=[];routes.forEach((r,ri)=>r.stops.forEach(s=>stops.push({...s,route:ri})));$('status').innerHTML='<span class="ok">✓ Mode de secours : ligne 57 chargée</span>';return true}}catch{}return false}
function buildGraph(){const nodes=[],edges=new Map(),key=(ri,si)=>ri+':'+si;routes.forEach((r,ri)=>r.stops.forEach((s,si)=>{const n={id:key(ri,si),ri,si,route:r,stop:s};nodes.push(n);edges.set(n.id,[])}));routes.forEach((r,ri)=>{for(let i=0;i<r.stops.length-1;i++){const a=nodes.find(n=>n.id===key(ri,i)),b=nodes.find(n=>n.id===key(ri,i+1));if(a&&b){const d=dist(a.stop,b.stop);if(d<3)edges.get(a.id).push({to:b.id,type:'bus',min:busMin(d)})}}});const cell=.004,buckets=new Map();for(const n of nodes){const k=Math.floor(n.stop.lat/cell)+':'+Math.floor(n.stop.lon/cell);if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push(n)}for(const a of nodes){const x=Math.floor(a.stop.lat/cell),y=Math.floor(a.stop.lon/cell);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(const b of buckets.get((x+dx)+':'+(y+dy))||[]){if(a.ri===b.ri)continue;const d=dist(a.stop,b.stop);if(d<=.45)edges.get(a.id).push({to:b.id,type:'transfer',min:walkMin(d)+2})}}return{nodes,edges}}
function solve(A,B){const g=buildGraph();if(!g.nodes.length)return null;const starts=g.nodes.map(n=>({...n,d:dist(A,n.stop)})).filter(n=>n.d<1.2).sort((a,b)=>a.d-b.d).slice(0,25),goals=g.nodes.map(n=>({...n,d:dist(B,n.stop)})).filter(n=>n.d<1.2).sort((a,b)=>a.d-b.d).slice(0,25);if(!starts.length||!goals.length)return null;const goal=new Map(goals.map(x=>[x.id,x.d])),D=new Map(),P=new Map(),Q=[];starts.forEach(s=>{const c=walkMin(s.d);D.set(s.id,c);P.set(s.id,null);Q.push([c,s.id])});let end=null,endCost=Infinity,steps=0;while(Q.length&&steps++<30000){Q.sort((a,b)=>a[0]-b[0]);const [d,u]=Q.shift();if(d!==D.get(u))continue;if(goal.has(u)){const c=d+walkMin(goal.get(u));if(c<endCost){end=u;endCost=c}}if(d>endCost+30)continue;for(const e of g.edges.get(u)||[]){const nd=d+e.min;if(nd<(D.get(e.to)??Infinity)){D.set(e.to,nd);P.set(e.to,{prev:u,e});Q.push([nd,e.to])}}}if(!end)return null;const path=[];let c=end;const byId=new Map(g.nodes.map(n=>[n.id,n]));while(c){path.push(byId.get(c));const p=P.get(c);if(!p)break;c=p.prev}path.reverse();const legs=[];let bus=null;for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];if(a.ri===b.ri){if(!bus||bus.ri!==a.ri){bus={type:'bus',ri:a.ri,route:a.route,stops:[a.stop,b.stop]};legs.push(bus)}else bus.stops.push(b.stop)}else{bus=null;legs.push({type:'transfer',from:a.stop,to:b.stop,min:walkMin(dist(a.stop,b.stop))})}}return{path,legs,total:Math.round(endCost)}}
async function draw(A,B,p){clearMap();const all=[];for(const l of p.legs){if(l.type==='bus'){const r=await road(l.stops);if(r)all.push(...r);else all.push(...l.stops.map(s=>[s.lat,s.lon]))}else all.push([l.from.lat,l.from.lon],[l.to.lat,l.to.lon])}const a=p.path[0]?.stop,b=p.path[p.path.length-1]?.stop;if(a)all.unshift([A.lat,A.lon],[a.lat,a.lon]);if(b)all.push([b.lat,b.lon],[B.lat,B.lon]);if(all.length>1)layers.push(L.polyline(all,{color:'#0072ce',weight:6,opacity:.95}).addTo(map));layers.push(L.marker([A.lat,A.lon]).addTo(map),L.marker([B.lat,B.lon]).addTo(map));map.fitBounds(L.latLngBounds(all),{padding:[70,70]})}
function render(A,B,p){let h='<div class="route"><div class="big">🗺️ Meilleur itinéraire · ~'+p.total+' min</div><div class="small">'+esc(A.label||'Départ')+' → '+esc(B.label||'Destination')+'</div>',buses=0;for(const l of p.legs){if(l.type==='bus'){buses++;const km=l.stops.reduce((s,x,i)=>i?s+dist(l.stops[i-1],x):0,0);h+='<div class="step">🚌 <b>Ligne '+esc(l.route.ref)+'</b><div class="small">'+esc(l.stops[0].name)+' → '+esc(l.stops[l.stops.length-1].name)+' · ~'+busMin(km)+' min · '+l.stops.length+' arrêts</div></div>'}else h+='<div class="step">🔄 <b>Correspondance</b><div class="small">Marche ~'+l.min+' min jusqu’à '+esc(l.to.name)+'</div></div>'}h+='<div class="step">🚶 <b>Accès et sortie à pied</b><div class="small">Le temps total inclut la marche vers le premier et depuis le dernier arrêt.</div></div><span class="badge">'+Math.max(0,buses-1)+' correspondance'+(buses-1===1?'':'s')+'</span><div class="warn">⚠️ Aucun ETA GPS de bus n’est inventé.</div><button id="track" class="btn" style="width:100%;margin-top:10px">📍 Suivre ma progression</button><div id="progress" class="small" style="margin-top:8px"></div></div>';$('result').innerHTML=h;tracking(p)}
function tracking(p){const btn=$('track');if(!btn)return;let watch=null;btn.onclick=()=>{if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;btn.textContent='📍 Suivre ma progression';$('progress').textContent='Suivi arrêté.';return}if(!navigator.geolocation){$('progress').textContent='Géolocalisation indisponible.';return}const ss=p.legs.filter(x=>x.type==='bus').flatMap(x=>x.stops);btn.textContent='⏹ Arrêter le suivi';$('progress').textContent='Localisation en attente…';watch=navigator.geolocation.watchPosition(pos=>{const q={lat:pos.coords.latitude,lon:pos.coords.longitude};let best=null;ss.forEach((s,i)=>{const d=dist(q,s);if(!best||d<best.d)best={s,i,d}});if(best){const next=ss[best.i+1];$('progress').innerHTML='<b>📍 Tu es près de '+esc(best.s.name)+'</b><br>'+(next?'Prochain arrêt : <b>'+esc(next.name)+'</b> · '+Math.max(0,ss.length-best.i-1)+' restant(s)':'Dernier arrêt atteint.')}},()=>{$('progress').textContent='⚠️ Impossible d’obtenir ta position. Vérifie l’autorisation de localisation.'},{enableHighAccuracy:true,maximumAge:5000,timeout:10000})}
async function calculate(){const btn=$('go');btn.disabled=true;btn.textContent='Recherche…';$('result').innerHTML='<b>🔎 Calcul du trajet…</b><div class="small">Recherche des arrêts proches et des correspondances.</div>';try{const A=await resolveInput($('from')),B=await resolveInput($('to'));if(!A){$('result').innerHTML='<b class="err">📍 Départ introuvable</b><div class="small">Autorise la localisation ou sélectionne un lieu.</div>';return}if(!B){$('result').innerHTML='<b class="err">📍 Destination introuvable</b>';return}if(!routes.length){const ok=await loadOSM();if(!ok)await loadFallback57()}if(!routes.length){$('result').innerHTML='<b class="err">Réseau indisponible</b><div class="small">Les données de transport ne sont pas accessibles pour le moment.</div>';return}const p=solve(A,B);if(!p){$('result').innerHTML='<b>Aucun itinéraire confirmé.</b><div class="small">Aucun chemin multimodal fiable n’a pu être établi avec les données disponibles.</div>';return}await draw(A,B,p);render(A,B,p)}catch(e){console.error(e);$('result').innerHTML='<b class="err">Erreur de calcul</b><div class="small">'+esc(e.message||'Erreur inconnue')+'</div>'}finally{btn.disabled=false;btn.textContent='Trouver le meilleur trajet'}}
$('go').onclick=calculate;$('gps').onclick=async()=>{const p=await position();if(p){$('from').value='Ma position';delete $('from').dataset.lat;delete $('from').dataset.lon;map.setView([p.lat,p.lon],15)}else alert('Autorise la localisation dans Safari.')};$('swap').onclick=()=>{const a=$('from').value,al=$('from').dataset.lat,ao=$('from').dataset.lon,an=$('from').dataset.label;$('from').value=$('to').value;$('from').dataset.lat=$('to').dataset.lat||'';$('from').dataset.lon=$('to').dataset.lon||'';$('from').dataset.label=$('to').dataset.label||'';$('to').value=a;$('to').dataset.lat=al||'';$('to').dataset.lon=ao||'';$('to').dataset.label=an||''};$('pick').onclick=()=>{pickMode=!pickMode;$('pick').classList.toggle('active',pickMode);$('mapBtn').classList.toggle('hidden',!pickMode);map.getContainer().style.cursor=pickMode?'crosshair':''};map.on('click',e=>{if(!pickMode)return;picked={lat:e.latlng.lat,lon:e.latlng.lng,label:'Point sur la carte'};if(pickedMarker)pickedMarker.remove();pickedMarker=L.marker(e.latlng).addTo(map);$('mapBtn').classList.remove('hidden')});$('mapBtn').onclick=()=>{if(!picked)return;$('to').value='Point sur la carte';$('to').dataset.lat=picked.lat;$('to').dataset.lon=picked.lon;$('to').dataset.label='Point sur la carte';pickMode=false;$('pick').classList.remove('active');$('mapBtn').classList.add('hidden');map.getContainer().style.cursor=''};
(async()=>{await loadNLTA();$('status').textContent='Chargement du réseau cartographique…';const got=await loadOSM();if(!got)await loadFallback57();if(!routes.length)$('status').innerHTML='<span class="err">Aucun réseau cartographique disponible.</span>'})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
