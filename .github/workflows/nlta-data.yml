name: Sync official NLTA bus data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'scripts/fetch_nlta.py'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install parser
        run: pip install pypdf
      - name: Download and parse NLTA official PDFs
        run: python scripts/fetch_nlta.py
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nlta-routes.json
          git diff --cached --quiet || git commit -m 'Sync official NLTA bus route data'
          git push
