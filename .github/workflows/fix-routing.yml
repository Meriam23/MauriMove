name: Fix routing geometry
on:
  push:
    paths:
      - '.github/workflows/fix-routing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch route rendering and durations
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          helper = r'''\nfunction routeBusMinutes(x){\n const ref=String(x.route.ref||'').trim().toUpperCase();\n const n=Math.max(0, x.j-x.i);\n // Official NLTA average journey-time stages for route 203: 0 min at stage 0, 25 min at stage 5, 50 min at stage 10.\n if(ref==='203') return Math.max(1,Math.round(n*5));\n // Official NLTA average stage times for route 57, direction Quatre Bornes -> Wolmar.\n if(ref==='57'){const t=[0,10,18,20,22,24,27,30,35,38,41,43,45,50];\n   const reverse=[0,5,7,9,12,15,20,23,26,28,30,32,40,50];\n   const arr=(String(x.route.from||'').toLowerCase().includes('wolmar')||String(x.route.to||'').toLowerCase().includes('quatre'))?reverse:t;\n   if(x.i>=0&&x.j>=0&&x.j<arr.length)return Math.max(1,arr[x.j]-arr[x.i]);\n }\n return null;\n}\nfunction routeIsPlausible(r){\n const ref=String(r.ref||'').trim().toUpperCase();\n if(ref!=='203') return true;\n const names=r.stops.map(x=>String(x.name||'').toLowerCase());\n const known=['port louis','brabant','grnw','camp benoit','petite riviere','foyer','gros cailloux','canot','saint martin','mont roches','camp levieux'];\n const hits=names.filter(n=>known.some(k=>n.includes(k))).length;\n return hits>=3 && (String(r.from||'').toLowerCase().includes('port louis') || String(r.to||'').toLowerCase().includes('port louis') || names.some(n=>n.includes('port louis')));\n}\n'''
          if 'function routeBusMinutes' not in s:
              s=s.replace('function draw(points){', helper+'\nfunction draw(points){',1)

          new_draw = r'''function draw(points){
 clearMarks();
 const fallback=L.polyline(points,{color:'#246bfd',weight:5,dashArray:'8 8'}).addTo(map);marks.push(fallback);
 const coords=points.map(p=>p[1]+','+p[0]).join(';');
 fetch('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&steps=false')
   .then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{
     if(!j.routes?.[0]?.geometry?.coordinates)return;
     fallback.remove();
     const ll=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
     marks.push(L.polyline(ll,{color:'#246bfd',weight:5}).addTo(map));
     marks.push(L.polyline([points[0],ll[0]],{color:'#ff5a36',weight:4,dashArray:'6 7'}).addTo(map));
     marks.push(L.polyline([ll.at(-1),points.at(-1)],{color:'#ff5a36',weight:4,dashArray:'6 7'}).addTo(map));
     marks.push(L.marker(points[0]).addTo(map).bindPopup('Départ'));
     marks.push(L.marker(points.at(-1)).addTo(map).bindPopup('Destination'));
     map.fitBounds(ll,{padding:[80,80]});
   }).catch(()=>map.fitBounds(points,{padding:[80,80]}));
}'''
          s=re.sub(r'function draw\(points\)\{.*?\n\}',new_draw,s,count=1,flags=re.S)

          new_card = r'''function cardDirect(x,w1,w2){
 const official=routeBusMinutes(x);
 const bus=official!==null?official:null;
 const busText=bus!==null?('Environ '+bus+' min — durée moyenne officielle NLTA pour ce tronçon'):'Durée bus non disponible dans les données officielles pour ce tronçon';
 const total=bus!==null?(w1.min+bus+w2.min):null;
 return '<div class="card best"><div class="big">⭐ Ligne '+esc(x.route.ref)+'</div><div class="small">'+esc(x.route.from||'')+(x.route.to?' → '+esc(x.route.to):'')+(x.route.operator?' · '+esc(x.route.operator):'')+'</div><div class="step"><div class="ico">🚶</div><div><b>'+esc(x.os.name||'Arrêt de bus')+'</b><div class="small">'+w1.min+' min · '+w1.m+' m depuis le départ</div></div></div><div class="step"><div class="ico">🚌</div><div><b>'+esc(x.os.name||'Arrêt de bus')+' → '+esc(x.ds.name||'Arrêt de bus')+'</b><div class="small">'+busText+'</div></div></div><div class="step"><div class="ico">🚶</div><div><b>'+esc(x.ds.name||'Arrêt de bus')+'</b><div class="small">'+w2.min+' min · '+w2.m+' m jusqu’à la destination</div></div></div><span class="pill">Correspondance : directe</span></div><div class="warn">'+(total!==null?('⏱️ Durée indicative totale : <b>~'+total+' min</b>.'):('⏱️ Durée totale non affichée tant que la durée bus officielle de ce tronçon n’est pas connue.'))+' Aucun ETA temps réel n’est inventé.</div>'}'''
          s=re.sub(r'function cardDirect\(x,w1,w2\)\{.*?\n\}',new_card,s,count=1,flags=re.S)

          # Prevent obviously invalid OSM relations such as a route 203 relation with unrelated stops.
          old="for(const ri of ar){const r=routes[ri],i=r.stops.findIndex(x=>x.id===s.id),j=r.stops.findIndex(x=>x.id===t.id);if(i>=0&&j>i)res.push({type:'direct',route:r,ri,i,j,os:s,ds:t,walkA:s.d,walkB:t.d,busStops:j-i})}"
          new="for(const ri of ar){const r=routes[ri];if(!routeIsPlausible(r))continue;const i=r.stops.findIndex(x=>x.id===s.id),j=r.stops.findIndex(x=>x.id===t.id);if(i>=0&&j>i)res.push({type:'direct',route:r,ri,i,j,os:s,ds:t,walkA:s.d,walkB:t.d,busStops:j-i})}"
          s=s.replace(old,new)

          # Make candidate ordering use actual walking distances rather than the broken expression.
          s=s.replace("return res.sort((x,y)=>x.walkA+x.walkB-x.walkB-(y.walkA+y.walkB-y.walkB)).slice(0,12)","return res.sort((x,y)=>(x.walkA+x.walkB)-(y.walkA+y.walkB)).slice(0,12)")

          # Transfer bus durations: use official duration where possible, otherwise do not invent minutes.
          s=s.replace("const bus1=Math.max(10,(choice.transfer?choice.r1.stops.findIndex(x=>x.id===choice.transfer.id)-choice.i:1)*3),bus2=Math.max(10,(choice.j-choice.idx2)*3);","const bus1=null,bus2=null;")
          s=s.replace("<div class=\"small\">~'+bus1+' min jusqu’à '+esc(choice.transfer.name)+'</div>","<div class=\"small\">Durée bus à confirmer par les horaires officiels</div>")
          s=s.replace("<div class=\"small\">~'+bus2+' min jusqu’à '+esc(choice.t.name)+'</div>","<div class=\"small\">Durée bus à confirmer par les horaires officiels</div>")
          s=s.replace("<div class=\"warn\">⏱️ Temps indicatif. Les horaires officiels et ETA temps réel seront ajoutés séparément.</div>","<div class=\"warn\">⏱️ Temps total non inventé : les durées de bus de ces correspondances doivent être confirmées par les horaires officiels. Aucun ETA temps réel n’est inventé.</div>")

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix bus route geometry and ETA logic'
          git push
