name: Add place autocomplete
on:
  push:
    paths:
      - '.github/workflows/autocomplete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add autocomplete UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='''\n.autocomplete-wrap{position:relative}.suggestions{display:none;background:#fff;border:1px solid #e4e7ec;border-radius:14px;margin:6px 0;overflow:hidden;box-shadow:0 12px 30px #0002;max-height:280px;overflow-y:auto}.suggestions button{display:block;width:100%;text-align:left;background:#fff;border:0;padding:12px 14px;font-size:13px;color:#101828}.suggestions button:active{background:#f2f4f7}.suggestions button+button{border-top:1px solid #eee}.suggestion-title{font-weight:800}.suggestion-meta{font-size:11px;color:#667085;margin-top:2px}\n'''
          if '.suggestion-title' not in s:
              s=s.replace('</style>',css+'</style>',1)

          old="$('to').addEventListener('input',()=>{$('toSuggest').style.display=$('to').value.trim()?'block':'none';$('toSuggest').innerHTML='<button type=\"button\">📍 '+esc($('to').value.trim())+', Mauritius</button>';$('toSuggest').querySelector('button').onclick=()=>{$('toSuggest').style.display='none';calculate()}});"
          new=r'''let suggestTimer=null;
+async function searchPlaces(input,box){
+ const q=input.value.trim();
+ if(q.length<2){box.style.display='none';box.innerHTML='';return}
+ clearTimeout(suggestTimer);
+ suggestTimer=setTimeout(async()=>{
+   box.innerHTML='<div class="small" style="padding:12px">🔎 Recherche de lieux…</div>';box.style.display='block';
+   try{
+     const r=await fetch(NOM+'?format=jsonv2&addressdetails=1&limit=7&countrycodes=mu&q='+encodeURIComponent(q),{headers:{'Accept-Language':'fr'}});
+     const items=r.ok?await r.json():[];
+     const local=stops.filter(s=>norm(s.name).includes(norm(q))).slice(0,4).map(s=>({lat:s.lat,lon:s.lon,display_name:s.name,type:'Arrêt de bus'}));
+     const merged=[...local,...items].filter((x,i,a)=>i===a.findIndex(y=>Math.abs(+y.lat-+x.lat)<0.00005&&Math.abs(+y.lon-+x.lon)<0.00005)).slice(0,7);
+     if(!merged.length){box.innerHTML='<div class="small" style="padding:12px">Aucun lieu trouvé à Maurice.</div>';return}
+     box.innerHTML='';
+     merged.forEach(item=>{
+       const b=document.createElement('button');b.type='button';
+       const name=item.name||item.display_name?.split(',')[0]||q;
+       const meta=item.type==='Arrêt de bus'?'Arrêt de bus':(item.display_name||'Maurice').split(',').slice(1,3).join(', ').trim()||'Maurice';
+       b.innerHTML='<div class="suggestion-title">📍 '+esc(name)+'</div><div class="suggestion-meta">'+esc(meta)+'</div>';
+       b.onclick=()=>{input.value=name;input.dataset.lat=item.lat;input.dataset.lon=item.lon;input.dataset.label=name;box.style.display='none';box.innerHTML='';};
+       box.appendChild(b);
+     });
+   }catch(e){box.innerHTML='<div class="small" style="padding:12px">Recherche indisponible. Vérifie la connexion.</div>'}
+ },220);
+}
+function attachAutocomplete(input,box){
+ input.addEventListener('input',()=>searchPlaces(input,box));
+ input.addEventListener('focus',()=>{if(input.value.trim().length>=2)searchPlaces(input,box)});
+ input.addEventListener('keydown',e=>{if(e.key==='Escape')box.style.display='none';if(e.key==='Enter'&&box.style.display==='block'){const first=box.querySelector('button');if(first){e.preventDefault();first.click()}}});
+}
+attachAutocomplete($('from'),$('fromSuggest'));attachAutocomplete($('to'),$('toSuggest'));'''.replace('\n+','\n')
+          if old in s:
+              s=s.replace(old,new,1)
+          elif 'function searchPlaces(input,box)' not in s:
+              marker="if(location.protocol==='https:'&&'serviceWorker' in navigator)"
+              s=s.replace(marker,new+'\n'+marker,1)
+
+          # Use a selected autocomplete coordinate directly, avoiding a second ambiguous geocoding request.
+          oldgeo="async function resolve(q){if(norm(q)==='ma position'){return lastPosition||await getPosition()}return geo(q)}"
+          newgeo="async function resolve(q){const el=q===document.getElementById('from').value?document.getElementById('from'):document.getElementById('to');if(el.dataset.lat&&el.dataset.lon)return{lat:+el.dataset.lat,lon:+el.dataset.lon,label:el.dataset.label||q};if(norm(q)==='ma position'){return lastPosition||await getPosition()}return geo(q)}"
+          s=s.replace(oldgeo,newgeo)
+
+          # Clear stale selected coordinates when the user edits the field.
+          s=s.replace("input.addEventListener('input',()=>searchPlaces(input,box));","input.addEventListener('input',()=>{delete input.dataset.lat;delete input.dataset.lon;delete input.dataset.label;searchPlaces(input,box)});")
+          p.write_text(s,encoding='utf-8')
+          PY
+      - name: Commit patch
+        run: |
+          git config user.name 'github-actions[bot]'
+          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
+          git add index.html
+          git diff --cached --quiet || git commit -m 'Add searchable place suggestions'
+          git push
