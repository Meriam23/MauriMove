name: Deploy refined SegaMap mobile experience
on:
  workflow_run:
    workflows: ["Deploy MauriMove to GitHub Pages"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare refined SegaMap build
        run: python3 scripts/prepare_refined_build.py
      - name: Validate refined page
        run: |
          test -s index.html
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'segamap-app-icon.svg?v=final9',
              'refined-logo-final',
              'search-layout-final',
              'route-screen-final',
              'SOFITEL_STOP',
              'Flic en Flac Public Beach / Wolmar',
              'valhalla1.openstreetmap.de',
          ]
          for item in checks:
              assert item in s, item
          assert 'id="gps"' not in s
          assert 'id="pick"' not in s
          print('Refined SegaMap build validation OK')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy refined page
        id: deployment
        uses: actions/deploy-pages@v4
