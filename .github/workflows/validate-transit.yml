name: Validate transit data

on:
  push:
    paths:
      - 'data/transit/**'
      - 'scripts/validate-transit.mjs'
      - '.github/workflows/validate-transit.yml'
  pull_request:
    paths:
      - 'data/transit/**'
      - 'scripts/validate-transit.mjs'
      - '.github/workflows/validate-transit.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-transit.mjs
