name: Deploy MauriMove to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare stable SegaMap build
        run: python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('href=\"./manifest.webmanifest?v=14\"','href=\"./manifest.webmanifest?v=stable\"'); s=s.replace('href=\"./segamap-logo.svg?v=14\"','href=\"./segamap-app-icon.svg?v=stable\"'); s=s.replace('src=\"./segamap-logo.svg?v=14\"','src=\"./segamap-logo-v2.svg?v=stable\"'); s=s.replace('await loadNLTA();await loadOSM();','await loadOSM();'); s=s.replace('$(\'status\').innerHTML=\'<span class=\"ok\">✓ \'+routes.length+\' parcours routables chargés · \'+nltaCount+\' lignes NLTA au catalogue</span>\';','$(\'status\').innerHTML=\'<span class=\"ok\">✓ \'+routes.length+\' parcours routables chargés</span>\';'); p.write_text(s,encoding='utf-8')"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
