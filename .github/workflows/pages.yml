name: Deploy MauriMove to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare SegaMap build
        run: |
          python3 scripts/finalize_refined_build.py
          python3 scripts/west_ui_patch.py
          python3 scripts/site_ux_corrections.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const map=L.map('map')", "const map=window.segaMap=L.map('map')")
          tag = '<script>window.SEGAMAP_ROUTING_API="https://segamap-routing.YOUR_WORKERS_SUBDOMAIN.workers.dev";</script><script src="./segamap-routing-worker.js?v=1"></script>'
          s = s if 'segamap-routing-worker.js?v=1' in s else s.replace('</body>', tag + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate prepared page
        run: |
          test -s index.html
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'segamap-app-icon.svg?v=final9',
              'refined-logo-final',
              'search-layout-final',
              'route-screen-final',
              'segamap-final-corrections-js',
              'segamap-west-corridor-final',
              'segamap-site-ux-final',
              'showOverview()',
              'Carrefour City Flic-en-Flac',
              'carrefourLat=-20.27925',
              'SOFITEL_STOP',
              'Flic en Flac Public Beach / Wolmar',
              'La Preneuse',
              'Grande Riviere Noire (Trois Bras Store)',
              'valhalla1.openstreetmap.de',
              'C-Care Tamarin — District One, La Mivoie',
              'home-ready',
              'segamap-routing-worker.js?v=1',
              'window.segaMap=L.map',
          ]
          for item in checks:
              assert item in s, item
          assert 'id="gps"' not in s
          assert 'id="pick"' not in s
          assert 'Trouver le meilleur trajet' not in s
          assert 'Prêt 😊' not in s
          assert 'Suivre ma progression' not in s
          print('SegaMap final build validation OK')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
