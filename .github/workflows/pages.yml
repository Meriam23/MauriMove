name: Deploy MauriMove to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore golden SegaMap UI base
        run: git checkout dd87d2ef9263bc9ee52910ba5a5e009f001f4837 -- index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare SegaMap build
        run: |
          python3 scripts/finalize_refined_build.py
          python3 scripts/west_ui_patch.py
          python3 scripts/site_ux_corrections.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('@media(max-width:760px)', '@media(max-width:1600px)')
          s = s.replace('@media(min-width:761px)', '@media(min-width:1601px)')
          s = s.replace('@media(max-width:1100px)', '@media(max-width:1600px)')
          s = s.replace('@media(min-width:1101px)', '@media(min-width:1601px)')
          s = s.replace('max-height:46dvh!important', 'max-height:52dvh!important')
          badge = '''<div id="segamap-version-badge" style="position:fixed;right:10px;top:10px;z-index:9999;background:#06143F;color:#fff;border-radius:999px;padding:5px 9px;font:700 10px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-shadow:0 4px 14px #0003;letter-spacing:.2px">v1.4 · Production UI</div>'''
          if 'id="segamap-version-badge"' in s:
              import re
              s = re.sub(r'<div id="segamap-version-badge"[^>]*>.*?</div>', badge, s, count=1)
          else:
              s = s.replace('<body>', '<body>' + badge, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate prepared page
        run: |
          test -s index.html
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = ['segamap-app-icon.svg?v=final9','refined-logo-final','search-layout-final','route-screen-final','segamap-final-corrections-js','segamap-west-corridor-final','segamap-site-ux-final','showOverview()','segamap-version-badge','v1.4 · Production UI','@media(max-width:1600px)','max-height:52dvh!important','segamap-search-visibility-fix','#toSug']
          missing = [item for item in checks if item not in s]
          if missing: raise SystemExit('SegaMap v1.4 UI validation failed: ' + ', '.join(missing))
          assert 'https://maurimove.meriammb.workers.dev' not in s
          assert 'https://maurimove.meriamb.workers.dev' not in s
          assert 'id="gps"' not in s
          assert 'id="pick"' not in s
          assert 'Trouver le meilleur trajet' not in s
          assert 'Prêt 😊' not in s
          assert 'Réseau mauricien' not in s
          print('SegaMap v1.4 responsive UI validation OK')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
