name: Deploy MauriMove to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare stable SegaMap build
        run: python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('href=\"./manifest.webmanifest?v=14\"','href=\"./manifest.webmanifest?v=final4\"'); s=s.replace('href=\"./segamap-logo.svg?v=14\"','href=\"./segamap-app-icon.svg?v=final4\"'); s=s.replace('src=\"./segamap-logo.svg?v=14\"','src=\"./segamap-app-icon.svg?v=final4\"'); s=s.replace('<span class=\"name\">SegaMap</span><span>🇲🇺</span>','<span class=\"name\">SegaMap</span>'); s=s.replace('.brand{display:flex;align-items:center;gap:9px;font-size:28px;font-weight:950}', '.brand{display:flex;align-items:center;gap:9px;font-size:28px;font-weight:600;letter-spacing:-.4px}'); s=s.replace('.go{width:100%;border:0;background:linear-gradient(90deg,#ef233c,#0072ce);color:#fff;border-radius:14px;padding:14px;margin-top:8px;font-weight:950;font-size:15px}', '.go{width:100%;border:0;background:linear-gradient(to bottom,#EA2839 0%,#EA2839 25%,#1A206D 25%,#1A206D 50%,#FFD500 50%,#FFD500 75%,#00A651 75%,#00A651 100%);color:#fff;border-radius:14px;padding:14px;margin-top:8px;font-weight:900;font-size:17px;text-shadow:0 1px 3px #0008;box-shadow:0 5px 14px #0002}'); s=s.replace('<button class=\"btn\" id=\"pick\">📍 Carte</button>',''); s=s.replace(\"$('pick').onclick=()=>{pickMode=!pickMode;$('pick').textContent=pickMode?'📍 Cliquez sur la carte':'📍 Carte';map.getContainer().style.cursor=pickMode?'crosshair':''};\",''); s=s.replace(\"map.on('click',e=>{if(!pickMode)return;const i=$('to');i.value='Point sur la carte';i.dataset.lat=e.latlng.lat;i.dataset.lon=e.latlng.lng;i.dataset.label='Point sur la carte';pickMode=false;$('pick').textContent='📍 Carte';L.marker(e.latlng).addTo(map).bindPopup('Destination').openPopup()});\",''); s=s.replace('Trouver le meilleur trajet','Go'); s=s.replace(\"go.textContent='Trouver le meilleur trajet'\",\"go.textContent='Go'\"); s=s.replace('await loadNLTA();await loadOSM();','await loadOSM();'); s=s.replace(\"$('status').innerHTML='<span class=\\\"ok\\\">✓ '+routes.length+' parcours routables chargés · '+nltaCount+' lignes NLTA au catalogue</span>';\",\"$('status').innerHTML='<span class=\\\"ok\\\">✓ '+routes.length+' parcours routables chargés</span>';\"); p.write_text(s,encoding='utf-8')"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
