name: Update MauriMove homepage
on:
  push:
    paths:
      - '.github/workflows/update-home.yml'
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write new homepage
        run: |
          cat > index.html <<'HTML'
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="description" content="MauriMove — itinéraires de transport public à Maurice">
<title>MauriMove 🇲🇺</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#eef1f5;color:#101828}
#map{position:fixed;inset:0}.panel{position:fixed;z-index:1000;left:12px;top:12px;width:min(500px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:#fffffff2;backdrop-filter:blur(20px);border-radius:24px;padding:16px;box-shadow:0 20px 70px #0003}
.brand{font-size:28px;font-weight:950;letter-spacing:-1px}.brand span{color:#ff5a36}.sub{font-size:12px;color:#667085;margin:3px 0 14px}
.search{background:#fff;border:1px solid #e4e7ec;border-radius:16px;overflow:hidden}.field{display:flex;gap:10px;padding:14px}.field+.field{border-top:1px solid #eaecf0}.dot{width:10px;height:10px;border-radius:50%;background:#ff5a36;margin-top:5px;flex:0 0 auto}.dot.blue{background:#246bfd}input{border:0;outline:0;width:100%;font-size:16px;background:transparent}
.go{width:100%;margin-top:9px;background:#101828;color:#fff;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:15px}.go:disabled{opacity:.55}.loc{margin-top:8px;width:100%;background:#fff;border:1px solid #d0d5dd;border-radius:12px;padding:10px;font-weight:800}
.title{font-size:12px;font-weight:900;margin:14px 0 7px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:12px;margin:7px 0}.best{border:2px solid #ff5a36}.big{font-size:19px;font-weight:950}.small{font-size:12px;color:#667085;line-height:1.45;margin-top:4px}.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.step:last-child{border:0}.ico{font-size:21px;width:27px}.pill{display:inline-block;background:#ecfdf3;color:#067647;border-radius:999px;padding:5px 7px;font-size:10px;font-weight:900;margin-top:7px}.warn{background:#fffaeb;color:#b54708;padding:9px;border-radius:11px;font-size:11px;line-height:1.45}.ok{color:#067647;font-weight:900}.err{color:#b42318;font-weight:900}.footer{font-size:10px;color:#98a2b3;line-height:1.45;margin-top:10px}.routes{max-height:140px;overflow:auto}.route-row{padding:8px 0;border-bottom:1px solid #eee;font-size:12px}.route-row b{font-size:13px}
</style>
</head>
<body>
<div id="map"></div>
<section class="panel">
<div class="brand">Mauri<span>Move</span> 🇲🇺</div>
<div class="sub">Le transport mauricien, pensé comme Citymapper</div>
<div class="search">
<div class="field"><span class="dot"></span><input id="from" value="Ma position" placeholder="Départ" autocomplete="off"></div>
<div class="field"><span class="dot blue"></span><input id="to" placeholder="Où allez-vous ?" autocomplete="off"></div>
</div>
<button class="loc" id="gps">⌖ Utiliser ma position</button>
<button class="go" id="go">Trouver le meilleur trajet</button>
<div class="title">Itinéraire</div>
<div id="results"><div class="card small">Entre simplement un départ et une destination. Aucun lieu n'est imposé sur l'accueil.</div></div>
<div class="title">Réseau MauriMove</div>
<div id="status" class="small">Chargement des lignes de bus cartographiées…</div>
<div id="routes" class="routes"></div>
<div class="footer">Le moteur utilise les relations de lignes de bus cartographiées dans OpenStreetMap pour construire le réseau. Les horaires officiels NLTA seront utilisés lorsqu'ils sont disponibles. Les temps sans horaire sont explicitement indiqués comme estimations.</div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const OVERPASS='https://overpass-api.de/api/interpreter';
const NOM='https://nominatim.openstreetmap.org/search';
const FOOT='https://routing.openstreetmap.de/routed-foot/route/v1/driving/';
const map=L.map('map').setView([-20.3484,57.5522],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let network=null,lastPos=null,drawn=[];
const $=id=>document.getElementById(id);
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function km(a,b){return Math.hypot((a.lat-b.lat)*111,(a.lon-b.lon)*104)}
async function geocode(q){try{const r=await fetch(NOM+'?format=jsonv2&limit=1&countrycodes=mu&q='+encodeURIComponent(q+', Mauritius'),{headers:{'Accept-Language':'fr'}});const a=r.ok?await r.json():[];return a[0]?{lat:+a[0].lat,lon:+a[0].lon,label:q}:null}catch(e){return null}}
function position(){return new Promise(res=>navigator.geolocation.getCurrentPosition(p=>{lastPos={lat:p.coords.latitude,lon:p.coords.longitude,label:'Ma position'};res(lastPos)},()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:30000}))}
async function walk(a,b){try{const r=await fetch(FOOT+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=false&steps=false');const j=await r.json();if(j.routes?.[0])return{min:Math.max(1,Math.round(j.routes[0].duration/60)),m:Math.round(j.routes[0].distance)}}catch(e){}const d=km(a,b);return{min:Math.max(1,Math.round(d/5*60)),m:Math.round(d*1000)}}
async function loadNetwork(){
 const q='[out:json][timeout:90];area["ISO3166-1"="MU"][admin_level=2]->.mu;(relation["type"="route"]["route"="bus"](area.mu);relation["type"="route_master"]["route_master"="bus"](area.mu););out body;>;out skel qt;';
 try{const r=await fetch(OVERPASS,{method:'POST',body:'data='+encodeURIComponent(q)});if(!r.ok)throw Error(r.status);const j=await r.json(),nodes=new Map(),rels=[];for(const e of j.elements){if(e.type==='node'&&e.lat&&e.lon)nodes.set(e.id,{id:e.id,lat:e.lat,lon:e.lon,name:e.tags?.name||'Arrêt'});if(e.type==='relation'&&e.tags?.route==='bus')rels.push(e)}const routes=[];for(const rel of rels){const stops=(rel.members||[]).filter(m=>m.type==='node'&&['stop','platform','stop_entry_only','stop_exit_only','platform_entry_only','platform_exit_only'].includes(m.role)).map(m=>nodes.get(m.ref)).filter(Boolean);if(stops.length>=2)routes.push({id:rel.id,ref:rel.tags?.ref||rel.tags?.name||'Bus',name:rel.tags?.name||'',operator:rel.tags?.operator||'',from:rel.tags?.from||'',to:rel.tags?.to||'',stops})}network={nodes,routes};$('status').innerHTML='<span class="ok">✓ '+routes.length+' lignes / variantes cartographiées chargées</span>';const uniq=[...new Map(routes.map(r=>[r.ref,r])).values()].sort((a,b)=>a.ref.localeCompare(b.ref,undefined,{numeric:true}));$('routes').innerHTML=uniq.slice(0,120).map(r=>'<div class="route-row"><b>'+esc(r.ref)+'</b> · '+esc(r.from||'')+' → '+esc(r.to||'')+'</div>').join('')+(uniq.length>120?'<div class="small">+ '+(uniq.length-120)+' autres lignes</div>':'')}catch(e){$('status').innerHTML='<span class="err">Impossible de charger le réseau bus.</span><div class="small">Le service cartographique est temporairement indisponible. Réessaie dans quelques secondes.</div>'}}
function nearestStops(p,limit=8){return network.routes.flatMap(r=>r.stops.map((s,i)=>({r,s,i,d:km(p,s)}))).sort((a,b)=>a.d-b.d).slice(0,limit)}
function nearbyTransfers(s,routeId){const out=[];for(const r of network.routes)if(r.id!==routeId)for(let i=0;i<r.stops.length;i++){const d=km(s,r.stops[i]);if(d<=0.12)out.push({r,i,d})}return out.slice(0,8)}
function busCost(r,a,b){return Math.max(1,km(r.stops[a],r.stops[b])/25*60)}
function dijkstra(startCandidates,endCandidates){const N=new Map(),Q=[];const key=(r,i)=>r.id+':'+i;for(const r of network.routes)for(let i=0;i<r.stops.length;i++)N.set(key(r,i),{r,i,s:r.stops[i],dist:Infinity,prev:null,mode:null});const targets=new Set(endCandidates.map(x=>key(x.r,x.i)));for(const x of startCandidates){const n=N.get(key(x.r,x.i));if(n){n.dist=x.d/5*60;n.mode='walk';Q.push(n)}}const seen=new Set();while(Q.length){Q.sort((a,b)=>a.dist-b.dist);const u=Q.shift(),uk=key(u.r,u.i);if(seen.has(uk))continue;seen.add(uk);if(targets.has(uk))return u;const neigh=[];if(u.i>0)neigh.push({r:u.r,i:u.i-1,cost:busCost(u.r,u.i-1,u.i),mode:'bus'});if(u.i<u.r.stops.length-1)neigh.push({r:u.r,i:u.i+1,cost:busCost(u.r,u.i,u.i+1),mode:'bus'});for(const x of nearbyTransfers(u.s,u.r.id))neigh.push({r:x.r,i:x.i,cost:x.d/5*60,mode:'walk'});for(const v of neigh){const n=N.get(key(v.r,v.i));if(!n||seen.has(key(v.r,v.i)))continue;const nd=u.dist+v.cost;if(nd<n.dist){n.dist=nd;n.prev=u;n.mode=v.mode;Q.push(n)}}}return null}
async function calculate(){
 $('go').disabled=true;$('go').textContent='Recherche…';$('results').innerHTML='<div class="card"><b>🔎 Recherche de toutes les lignes disponibles…</b><div class="small">Je compare marche, bus et correspondances.</div></div>';if(!network)await loadNetwork();let A=norm($('from').value)==='ma position'?(lastPos||await position()):await geocode($('from').value),B=await geocode($('to').value);if(!A||!B){$('results').innerHTML='<div class="card"><b>Je ne peux pas localiser le départ ou la destination.</b><div class="small">Autorise la localisation ou précise l’adresse/localité.</div></div>';$('go').disabled=false;$('go').textContent='Trouver le meilleur trajet';return}const starts=nearestStops(A,12),ends=nearestStops(B,12);if(!starts.length||!ends.length){$('results').innerHTML='<div class="card"><b>Aucun arrêt de bus cartographié à proximité.</b></div>';$('go').disabled=false;return}let best=null;for(const s of starts)for(const e of ends){const end=dijkstra([s],[e]);if(end&&(!best||end.dist<best.end.dist))best={start:s,end}}if(!best){$('results').innerHTML='<div class="card"><b>Aucun itinéraire bus trouvé dans le réseau cartographié.</b><div class="small">Aucune chaîne de lignes cartographiées ne relie actuellement ces zones.</div></div>';$('go').disabled=false;$('go').textContent='Trouver le meilleur trajet';return}const chain=[];let cur=best.end;while(cur){chain.push(cur);cur=cur.prev}chain.reverse();drawn.forEach(x=>x.remove());drawn=[];const pts=[[A.lat,A.lon],[best.start.s.lat,best.start.s.lon],...chain.map(x=>[x.s.lat,x.s.lon]),[B.lat,B.lon]];drawn.push(L.marker([A.lat,A.lon]).addTo(map),L.marker([B.lat,B.lon]).addTo(map),L.polyline([[A.lat,A.lon],[best.start.s.lat,best.start.s.lon]],{color:'#ff5a36',weight:4,dashArray:'6 7'}).addTo(map),L.polyline(chain.map(x=>[x.s.lat,x.s.lon]),{color:'#246bfd',weight:5}).addTo(map),L.polyline([[chain.at(-1).s.lat,chain.at(-1).s.lon],[B.lat,B.lon]],{color:'#ff5a36',weight:4,dashArray:'6 7'}).addTo(map));map.fitBounds(pts,{padding:[80,80]});const refs=[...new Set(chain.map(x=>x.r.ref))],ws=await walk(A,best.start.s),we=await walk(chain.at(-1).s,B);$('results').innerHTML='<div class="card best"><div class="big">⭐ Meilleur trajet</div><div class="small">'+refs.map(esc).join(' → ')+'</div><div class="step"><div class="ico">🚶</div><div><b>'+esc(A.label)+' → '+esc(best.start.s.name)+'</b><div class="small">~'+ws.min+' min · '+ws.m+' m</div></div></div><div class="step"><div class="ico">🚌</div><div><b>'+refs.map(esc).join(' + ')+'</b><div class="small">Temps bus estimé à partir du réseau cartographié.</div></div></div><div class="step"><div class="ico">🚶</div><div><b>'+esc(B.label)+'</b><div class="small">~'+we.min+' min · '+we.m+' m</div></div></div><span class="pill">Réseau OSM · routage piéton</span></div><div class="warn">⚠️ Quand aucun horaire officiel n’est disponible, le temps de bus est une estimation géographique — jamais un faux ETA en direct.</div>';$('go').disabled=false;$('go').textContent='Trouver le meilleur trajet'}
$('gps').onclick=async()=>{const p=await position();if(p){$('from').value='Ma position';map.setView([p.lat,p.lon],15)}else alert('Autorise la localisation de Safari pour MauriMove.')};$('go').onclick=calculate;loadNetwork();
</script>
</body>
</html>
HTML
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Redesign MauriMove homepage for generic trip planning"
          git push
